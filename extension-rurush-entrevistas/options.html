<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rurush Entrevistas — Opciones</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1c1c1c; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 7px; box-sizing: border-box; }
  .hint { color: #666; font-size: 12px; font-weight: 400; }
  button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 6px; background: #e65100; color: #fff; cursor: pointer; }
  #ok { margin-left: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
  <h2>🎯 Rurush Entrevistas — Opciones</h2>

  <label>URL de la Aplicación web <span class="hint">(termina en /exec)</span></label>
  <input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec">

  <label>Llave <span class="hint">(la que sale al ejecutar crearLlave)</span></label>
  <input type="password" id="llave" autocomplete="off">

  <label>Tu nombre <span class="hint">(firma de los mensajes de WhatsApp)</span></label>
  <input type="text" id="firma" placeholder="Omar — Rurush Fitness Club">

  <h3>Recomendación final (promedio de la entrevista, 1 a 10)</h3>
  <div class="grid">
    <div><label>✅ Avanzar desde</label><input type="number" id="umbralAvanzar" step="0.1" min="1" max="10"></div>
    <div><label>🟡 Evaluar desde</label><input type="number" id="umbralEvaluar" step="0.1" min="1" max="10"></div>
  </div>
  <p class="hint">Por debajo de "Evaluar" sugiere no avanzar. Es solo una sugerencia: la decisión la tomas tú.</p>

  <button id="guardar">Guardar</button><button id="probar" style="background:#555">Probar conexión</button><span id="ok"></span>
  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
