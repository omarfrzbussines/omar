<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>

<div class="p"><div class="c"><span>2</span>Elige la lista y toca el nombre</div><img src="p2.png"></div>
<div class="p"><div class="c"><span>3</span>Toca 📞 Llamar y habla con el socio</div><img src="p3.png"></div>
<div class="p"><div class="c"><span>4</span>Marca cómo salió, nota y Guardar</div><img src="p4.png"></div>
</div>

</body></html>
