<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rurush FP — Opciones</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1c1c1c; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=password], input[type=number] { width: 100%; padding: 7px; box-sizing: border-box; }
  .hint { color: #666; font-size: 12px; font-weight: 400; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-weight: 600; }
  #mods td { padding: 6px 4px; border-top: 1px solid #eee; } #mods select { padding: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 6px; background: #e65100; color: #fff; cursor: pointer; }
  #ok { color: #1e6b35; margin-left: 10px; }
</style>
</head>
<body>
  <h2>🔥 Rurush FP — Opciones</h2>

  <div class="check"><input type="checkbox" id="enabled"> Activa (corre sola en el horario)</div>

  <h3>Módulos</h3>
  <p class="hint">🧪 Simulación arma los mensajes y los muestra en el ícono 🔥, pero NO los envía. Pasa a 📤 Envío real cuando lo hayas revisado, y pausa la rutina de Claude que reemplaza.</p>
  <table id="mods" style="width:100%;border-collapse:collapse"></table>

  <div class="grid">
    <div><label>Recordatorio mañana: hora</label><input type="number" id="mananaHora" min="6" max="12"></div>
    <div><label>...solo clases desde (hora)</label><input type="number" id="mananaDesdeHora" min="6" max="22"></div>
    <div><label>Máx. envíos por corrida</label><input type="number" id="maxEnviosCorrida" min="1" max="40"></div>
  </div>
  <h3>Recordatorio 2h</h3>

  <label>Token de Pipedrive <span class="hint">(Pipedrive → Configuración personal → API)</span></label>
  <input type="password" id="pipedriveToken" autocomplete="off">

  <label>Número de la sesión de WhatsApp Web <span class="hint">(ej. 51926918075 · vacío = no verificar)</span></label>
  <input type="text" id="expectedNumber">

  <label>Números que NUNCA se contactan <span class="hint">(uno por línea, con 51)</span></label>
  <textarea id="blocklist" rows="4" style="width:100%"></textarea>

  <div class="grid">
    <div><label>Desde (hora)</label><input type="number" id="startHour" min="0" max="23"></div>
    <div><label>Hasta (hora)</label><input type="number" id="endHour" min="0" max="23"></div>
    <div><label>Cada (min)</label><input type="number" id="intervalMin" min="15" max="120"></div>
  </div>
  <label>Enviar si a la clase le faltan ≤ (horas)</label>
  <input type="number" id="sendWindowH" min="1" max="8">

  <label>Imagen "cómo llegar" <span class="hint">(se envía después del texto con GPS · JPG o PNG)</span></label>
  <input type="file" id="img" accept="image/jpeg,image/png">
  <div style="margin-top:8px"><img id="imgPrev" style="max-width:220px;display:none;border-radius:6px"></div>
  <button id="imgDel" type="button" style="display:none;background:#eee;color:#1c1c1c;margin-top:6px">Quitar imagen</button>

  <button id="save">Guardar</button><span id="ok"></span>
  <script src="options.js"></script>
</body>
</html>
