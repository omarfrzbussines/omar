<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>Agenda Omar</title>
<style>
  :root {
    --bg: #0B0B0D;
    --surface: #151518;
    --surface-2: #1D1D22;
    --line: rgba(255, 255, 255, 0.07);
    --text: #F4F1EA;
    --muted: #8E8C95;
    --faint: #5D5B63;
    --gold: #C9A96E;
    --gold-soft: rgba(201, 169, 110, 0.14);
    --red: #E5484D;
    --red-soft: rgba(229, 72, 77, 0.14);
    --amber: #F0A04B;
    --amber-soft: rgba(240, 160, 75, 0.14);
    --green: #3DD68C;
    --radius: 18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased;
    min-height: 100vh; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: var(--text); }

  /* ---------- Encabezado ---------- */
  header { padding: calc(22px + var(--safe-t)) 20px 8px; position: relative; }
  .fecha-top { color: var(--gold); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 16px; }
  .sync { position: absolute; right: 20px; top: calc(24px + var(--safe-t)); width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .sync.on { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.red b { color: var(--red); }
  .stat.gold b { color: var(--gold); }

  /* ---------- Filtros de equipo ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 500; }
  .chip.sel { background: var(--gold); border-color: var(--gold); color: #17140E; }

  /* ---------- Lista ---------- */
  main { padding: 6px 16px calc(120px + var(--safe-b)); }
  .seccion { margin-top: 22px; }
  .seccion h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 4px 10px; }
  .seccion h2 .n { color: var(--faint); font-weight: 500; }
  .seccion.venc h2 { color: var(--red); }

  .card { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 14px 12px; margin-bottom: 8px; transition: opacity .35s, transform .35s; }
  .card:active { transform: scale(.985); }
  .card.saliendo { opacity: 0; transform: translateX(30px); }
  .check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3A3940; margin-top: 1px; display: grid; place-items: center; transition: all .2s; }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .2s; }
  .card.alta .check { border-color: var(--gold); }
  .card.hecha .check { background: var(--gold); border-color: var(--gold); }
  .card.hecha .check svg { opacity: 1; }
  .card.hecha .titulo { text-decoration: line-through; color: var(--muted); }
  .cuerpo { flex: 1; min-width: 0; }
  .titulo { font-size: 16px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .pill { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }
  .pill.quien { color: var(--text); }

  .vacio { text-align: center; color: var(--muted); padding: 48px 20px; }
  .vacio b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

  /* ---------- Barra inferior ---------- */
  nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); display: flex; align-items: center; gap: 8px; background: rgba(21, 21, 24, .86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 26px; padding: 8px; z-index: 20; }
  .tab { flex: 1; padding: 10px 0; border-radius: 18px; color: var(--muted); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab svg { width: 20px; height: 20px; }
  .tab.sel { color: var(--text); background: var(--surface-2); }
  .fab { flex: none; width: 56px; height: 56px; border-radius: 20px; background: var(--gold); color: #17140E; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(201, 169, 110, .25); }
  .fab svg { width: 26px; height: 26px; }

  /* ---------- Panel inferior ---------- */
  .velo { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
  .velo.on { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top-left-radius: 26px; border-top-right-radius: 26px; border-top: 1px solid var(--line); padding: 10px 20px calc(24px + var(--safe-b)); transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); z-index: 40; max-height: 90vh; overflow-y: auto; }
  .panel.on { transform: none; }
  .asa { width: 40px; height: 5px; border-radius: 3px; background: #3A3940; margin: 0 auto 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .panel .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .etq { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcion { padding: 9px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--text); }
  .opcion.sel { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .opcion input[type=date] { background: none; border: 0; padding: 0; width: 120px; color-scheme: dark; }
  .notas { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; color: var(--muted); font-size: 14px; white-space: pre-wrap; }

  .entrada { position: relative; }
  textarea { width: 100%; min-height: 84px; resize: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 56px 14px 14px; outline: none; font-size: 17px; }
  textarea:focus { border-color: var(--gold); }
  .mic { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; }
  .mic svg { width: 20px; height: 20px; }
  .mic.on { background: var(--red); color: #fff; animation: pulse 1s infinite; }
  .detectado { min-height: 20px; color: var(--gold); font-size: 13px; margin-top: 8px; }

  select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color-scheme: dark; }

  .acciones { display: flex; gap: 10px; margin-top: 24px; }
  .btn { flex: 1; padding: 15px; border-radius: 16px; font-weight: 600; font-size: 16px; background: var(--surface-2); border: 1px solid var(--line); }
  .btn.oro { background: var(--gold); border-color: var(--gold); color: #17140E; }
  .btn:disabled { opacity: .5; }

  /* ---------- Avisos ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translate(-50%, 20px); background: #F4F1EA; color: #111; padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; transition: all .25s; z-index: 60; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .demo { margin: 0 20px; padding: 8px 12px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); font-size: 13px; }
  .cargando { padding: 80px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="fecha-top" id="fechaTop"></div>
    <h1 id="saludo">Agenda</h1>
    <span class="sync" id="sync"></span>
    <div class="stats" id="stats"></div>
  </header>
  <div id="demo"></div>
  <div class="chips" id="chips"></div>
  <main id="lista"><div class="cargando">Cargando tu agenda…</div></main>

  <nav>
    <button class="tab sel" data-vista="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button class="tab" data-vista="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Agenda</button>
    <button class="tab" data-vista="equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4 0 4 1.5 4.6 4"/></svg>Equipo</button>
    <button class="fab" id="fab" aria-label="Agregar tarea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>

  <div class="velo" id="velo"></div>
  <div class="panel" id="panel"></div>
  <div class="toast" id="toast"></div>

<script>
/* ================== Datos y conexión ================== */
const DEMO = typeof google === 'undefined' || !google.script || !google.script.run;
const PRIORIDADES = ['Alta', 'Media', 'Baja'];
const RANGO_PRIO = { Alta: 0, Media: 1, Baja: 2 };
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const MESES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const YO = 'Omar';

const estado = { datos: null, vista: 'hoy', persona: 'Todos', pendientes: 0 };

function llamar(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  marcarSync(1);
  return new Promise(function (ok, mal) {
    if (DEMO) { setTimeout(function () { try { ok(demoApi[fn].apply(null, args)); } catch (e) { mal(e); } }, 350); return; }
    google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn].apply(null, args);
  }).finally(function () { marcarSync(-1); });
}
function marcarSync(d) {
  estado.pendientes += d;
  document.getElementById('sync').classList.toggle('on', estado.pendientes > 0);
}
function cargar(datos) { estado.datos = datos; render(); }
function error(e) { toast('No se pudo guardar: ' + (e && e.message ? e.message : e)); llamar('getData').then(cargar); }

/* ================== Fechas ================== */
const pad = function (n) { return String(n).padStart(2, '0'); };
function aISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function deISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function sumarDias(iso, n) { const d = deISO(iso); d.setDate(d.getDate() + n); return aISO(d); }
function diasEntre(a, b) { return Math.round((deISO(a) - deISO(b)) / 86400000); }
function hoy() { return estado.datos ? estado.datos.hoy : aISO(new Date()); }
function proximoDia(dow) { const h = deISO(hoy()); let n = (dow - h.getDay() + 7) % 7; if (n === 0) n = 7; return sumarDias(hoy(), n); }
function etiquetaFecha(iso) {
  if (!iso) return 'Sin fecha';
  const d = diasEntre(iso, hoy());
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d === -1) return 'Ayer';
  const f = deISO(iso);
  return DIAS[f.getDay()] + ' ' + f.getDate() + ' ' + MESES[f.getMonth()];
}

/* ================== Utilidades ================== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
let timerToast;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(timerToast); timerToast = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function ordenar(a, b) {
  const fa = a.fecha || '9999', fb = b.fecha || '9999';
  if (fa !== fb) return fa < fb ? -1 : 1;
  return (RANGO_PRIO[a.prioridad] ?? 1) - (RANGO_PRIO[b.prioridad] ?? 1);
}

/* ================== Agrupar ================== */
function agrupar(tareas, completo) {
  const g = { venc: [], hoy: [], man: [], semana: [], despues: [], proceso: [], sin: [] };
  tareas.forEach(function (t) {
    if (!t.fecha) { (t.estado === 'En proceso' ? g.proceso : g.sin).push(t); return; }
    const d = diasEntre(t.fecha, hoy());
    if (d < 0) g.venc.push(t);
    else if (d === 0) g.hoy.push(t);
    else if (d === 1) g.man.push(t);
    else if (d <= 7) g.semana.push(t);
    else g.despues.push(t);
  });
  Object.keys(g).forEach(function (k) { g[k].sort(ordenar); });
  const secciones = [
    ['venc', 'Vencidas', g.venc], ['hoy', 'Hoy', g.hoy], ['man', 'Mañana', g.man],
    ['semana', 'Próximos 7 días', g.semana]
  ];
  if (completo) secciones.push(['despues', 'Más adelante', g.despues]);
  secciones.push(['proceso', 'En proceso', g.proceso]);
  if (completo) secciones.push(['sin', 'Sin fecha', g.sin]);
  return secciones.filter(function (s) { return s[2].length; });
}

/* ================== Render ================== */
function render() {
  const d = estado.datos;
  const f = deISO(hoy());
  const hora = new Date().getHours();
  document.getElementById('fechaTop').textContent = DIAS_LARGO[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES_LARGO[f.getMonth()];
  document.getElementById('saludo').textContent = (hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches') + ', Omar';
  document.getElementById('demo').innerHTML = DEMO ? '<div class="demo">Modo demo: datos de ejemplo, no se guarda nada.</div>' : '';

  const mias = d.tareas.filter(function (t) { return t.responsable === YO; });
  const venc = mias.filter(function (t) { return t.fecha && t.fecha < hoy(); }).length;
  const deHoy = mias.filter(function (t) { return t.fecha === hoy(); }).length;
  const semana = mias.filter(function (t) { return t.fecha && t.fecha > hoy() && diasEntre(t.fecha, hoy()) <= 7; }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat ' + (venc ? 'red' : '') + '"><b>' + venc + '</b><span>Vencidas</span></div>' +
    '<div class="stat gold"><b>' + deHoy + '</b><span>Para hoy</span></div>' +
    '<div class="stat"><b>' + semana + '</b><span>Esta semana</span></div>';

  const chips = document.getElementById('chips');
  if (estado.vista === 'equipo') {
    const gente = ['Todos'].concat(d.personas.filter(function (p) { return p !== YO; }));
    chips.innerHTML = gente.map(function (p) {
      return '<button class="chip ' + (estado.persona === p ? 'sel' : '') + '" data-persona="' + esc(p) + '">' + esc(p) + '</button>';
    }).join('');
  } else chips.innerHTML = '';

  let tareas, completo;
  if (estado.vista === 'equipo') {
    tareas = d.tareas.filter(function (t) { return t.responsable !== YO && (estado.persona === 'Todos' || t.responsable === estado.persona); });
    completo = true;
  } else {
    tareas = mias;
    completo = estado.vista === 'todo';
  }
  const secciones = agrupar(tareas, completo);
  const lista = document.getElementById('lista');
  if (!secciones.length) {
    lista.innerHTML = estado.vista === 'hoy'
      ? '<div class="vacio"><b>Todo al día</b>No tienes nada vencido ni para hoy.</div>'
      : '<div class="vacio"><b>Sin tareas</b>No hay nada aquí por ahora.</div>';
    return;
  }
  lista.innerHTML = secciones.map(function (s) {
    return '<section class="seccion ' + s[0] + '"><h2>' + s[1] + ' <span class="n">' + s[2].length + '</span></h2>' +
      s[2].map(tarjeta).join('') + '</section>';
  }).join('');
}

function tarjeta(t) {
  const d = t.fecha ? diasEntre(t.fecha, hoy()) : null;
  let clase = '';
  if (d !== null && d < 0) clase = 'red';
  else if (d !== null && d <= 1) clase = 'amber';
  let fechaTxt = etiquetaFecha(t.fecha);
  if (d !== null && d < -1) fechaTxt = 'Hace ' + (-d) + ' días';
  const meta = [];
  if (t.fecha) meta.push('<span class="pill ' + clase + '">' + esc(fechaTxt) + '</span>');
  if (t.estado === 'En proceso') meta.push('<span class="pill gold">En proceso</span>');
  if (t.prioridad === 'Alta') meta.push('<span class="pill gold">Alta</span>');
  if (t.responsable !== YO) meta.push('<span class="pill quien">' + esc(t.responsable) + '</span>');
  if (t.area) meta.push('<span class="pill">' + esc(t.area) + '</span>');
  return '<div class="card ' + (t.prioridad === 'Alta' ? 'alta' : '') + '" data-row="' + t.row + '">' +
    '<button class="check" data-check="' + t.row + '" aria-label="Completar"><svg viewBox="0 0 24 24" fill="none" stroke="#17140E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>' +
    '<div class="cuerpo"><div class="titulo">' + esc(t.titulo) + '</div><div class="meta">' + meta.join('') + '</div></div></div>';
}

function buscar(row) { return estado.datos.tareas.find(function (t) { return t.row === Number(row); }); }

/* ================== Acciones ================== */
function completar(row) {
  const t = buscar(row);
  if (!t) return;
  const card = document.querySelector('.card[data-row="' + row + '"]');
  if (card) {
    card.classList.add('hecha');
    setTimeout(function () { card.classList.add('saliendo'); }, 350);
  }
  llamar('completarTarea', t.row, t.titulo).then(function (datos) {
    toast('Hecha. Pasó a HECHAS');
    setTimeout(function () { cargar(datos); }, 300);
  }).catch(error);
}

/* ---------- Panel ---------- */
function abrirPanel(html) {
  const p = document.getElementById('panel');
  p.innerHTML = '<div class="asa"></div>' + html;
  document.getElementById('velo').classList.add('on');
  p.classList.add('on');
}
function cerrarPanel() {
  document.getElementById('velo').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
  pararVoz();
}

function opcionesFecha(sel) {
  const lunes = proximoDia(1);
  const ops = [['Hoy', hoy()], ['Mañana', sumarDias(hoy(), 1)]];
  if (lunes !== sumarDias(hoy(), 1)) ops.push(['Lunes', lunes]);
  ops.push(['+1 semana', sumarDias(hoy(), 7)], ['Sin fecha', '']);
  let hay = false;
  let html = ops.map(function (o) {
    const s = !hay && o[1] === sel; if (s) hay = true;
    return '<button class="opcion ' + (s ? 'sel' : '') + '" data-fecha="' + o[1] + '">' + o[0] + '</button>';
  }).join('');
  html += '<label class="opcion ' + (!hay && sel ? 'sel' : '') + '"><input type="date" id="fechaLibre" value="' + (hay ? '' : esc(sel)) + '"></label>';
  return html;
}
function opcionesLista(attr, lista, sel) {
  return lista.map(function (v) {
    return '<button class="opcion ' + (v === sel ? 'sel' : '') + '" data-' + attr + '="' + esc(v) + '">' + esc(v) + '</button>';
  }).join('');
}
function elegir(grupo, boton) {
  grupo.querySelectorAll('.opcion').forEach(function (b) { b.classList.remove('sel'); });
  if (boton) boton.classList.add('sel');
}

/* ---------- Detalle de una tarea ---------- */
function abrirDetalle(row) {
  const t = buscar(row);
  if (!t) return;
  const f = { fecha: t.fecha, prioridad: t.prioridad, responsable: t.responsable };
  abrirPanel(
    '<h3>' + esc(t.titulo) + '</h3>' +
    '<div class="sub">' + esc([t.area, t.estado].filter(Boolean).join(' · ')) + '</div>' +
    (t.notas ? '<div class="notas">' + esc(t.notas) + '</div>' : '') +
    '<div class="etq">Fecha</div><div class="opciones" id="gFecha">' + opcionesFecha(t.fecha) + '</div>' +
    '<div class="etq">Prioridad</div><div class="opciones" id="gPrio">' + opcionesLista('prio', PRIORIDADES, t.prioridad) + '</div>' +
    '<div class="etq">Responsable</div><div class="opciones" id="gQuien">' + opcionesLista('quien', estado.datos.personas, t.responsable) + '</div>' +
    '<div class="acciones"><button class="btn" id="bGuardar">Guardar</button><button class="btn oro" id="bHecha">Completar</button></div>'
  );
  enlazarOpciones(f);
  document.getElementById('bHecha').onclick = function () { cerrarPanel(); setTimeout(function () { completar(row); }, 250); };
  document.getElementById('bGuardar').onclick = function () {
    const cambios = {};
    if (f.fecha !== t.fecha) cambios.fecha = f.fecha;
    if (f.prioridad !== t.prioridad) cambios.prioridad = f.prioridad;
    if (f.responsable !== t.responsable) cambios.responsable = f.responsable;
    cerrarPanel();
    if (!Object.keys(cambios).length) return;
    Object.assign(t, cambios); render();
    llamar('actualizarTarea', t.row, t.titulo, cambios).then(function (datos) { cargar(datos); toast('Guardado'); }).catch(error);
  };
}

function enlazarOpciones(f) {
  const gF = document.getElementById('gFecha');
  gF.onclick = function (e) {
    const b = e.target.closest('[data-fecha]');
    if (!b) return;
    f.fecha = b.dataset.fecha; f.fechaManual = true;
    elegir(gF, b); document.getElementById('fechaLibre').value = '';
  };
  document.getElementById('fechaLibre').onchange = function (e) {
    f.fecha = e.target.value; f.fechaManual = true;
    elegir(gF, e.target.closest('.opcion'));
  };
  const gP = document.getElementById('gPrio');
  gP.onclick = function (e) { const b = e.target.closest('[data-prio]'); if (!b) return; f.prioridad = b.dataset.prio; f.prioManual = true; elegir(gP, b); };
  const gQ = document.getElementById('gQuien');
  gQ.onclick = function (e) { const b = e.target.closest('[data-quien]'); if (!b) return; f.responsable = b.dataset.quien; elegir(gQ, b); };
}

/* ---------- Agregar tarea ---------- */
function abrirAgregar() {
  const f = { fecha: hoy(), prioridad: 'Media', responsable: estado.vista === 'equipo' && estado.persona !== 'Todos' ? estado.persona : YO, area: 'Rápida' };
  abrirPanel(
    '<h3>Nueva tarea</h3><div class="sub">Escribe o dicta. Puedes decir "mañana", "el lunes" o "urgente".</div>' +
    '<div class="entrada"><textarea id="txt" placeholder="¿Qué tienes que hacer?"></textarea>' +
    '<button class="mic" id="mic" aria-label="Dictar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button></div>' +
    '<div class="detectado" id="detectado"></div>' +
    '<div class="etq">Fecha</div><div class="opciones" id="gFecha">' + opcionesFecha(f.fecha) + '</div>' +
    '<div class="etq">Prioridad</div><div class="opciones" id="gPrio">' + opcionesLista('prio', PRIORIDADES, f.prioridad) + '</div>' +
    '<div class="etq">Responsable</div><div class="opciones" id="gQuien">' + opcionesLista('quien', estado.datos.personas, f.responsable) + '</div>' +
    '<div class="etq">Área</div><select id="selArea">' + estado.datos.areas.map(function (a) { return '<option ' + (a === f.area ? 'selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>' +
    '<div class="acciones"><button class="btn" id="bCancelar">Cancelar</button><button class="btn oro" id="bAgregar">Agregar</button></div>'
  );
  enlazarOpciones(f);
  const txt = document.getElementById('txt');
  setTimeout(function () { txt.focus(); }, 320);
  txt.oninput = function () { aplicarDeteccion(f, txt.value); };
  document.getElementById('selArea').onchange = function (e) { f.area = e.target.value; };
  document.getElementById('mic').onclick = function () { dictar(txt, f); };
  document.getElementById('bCancelar').onclick = cerrarPanel;
  document.getElementById('bAgregar').onclick = function () {
    const p = interpretar(txt.value);
    const titulo = p.titulo || txt.value.trim();
    if (!titulo) { toast('Escribe la tarea primero'); return; }
    cerrarPanel();
    llamar('agregarTarea', { titulo: titulo, fecha: f.fecha, prioridad: f.prioridad, responsable: f.responsable, area: f.area })
      .then(function (datos) { cargar(datos); toast('Tarea agregada'); }).catch(error);
  };
}

function aplicarDeteccion(f, texto) {
  const p = interpretar(texto);
  const partes = [];
  if (p.fecha !== undefined && !f.fechaManual) {
    f.fecha = p.fecha;
    const gF = document.getElementById('gFecha');
    gF.innerHTML = opcionesFecha(f.fecha);
    enlazarOpciones(f);
    partes.push(etiquetaFecha(p.fecha));
  }
  if (p.prioridad && !f.prioManual) {
    f.prioridad = p.prioridad;
    const gP = document.getElementById('gPrio');
    elegir(gP, gP.querySelector('[data-prio="' + p.prioridad + '"]'));
    partes.push('Prioridad ' + p.prioridad);
  }
  document.getElementById('detectado').textContent = partes.length ? 'Detecté: ' + partes.join(' · ') : '';
}

/* ---------- Entender fechas en el texto ---------- */
const NUM_DIA = { domingo: 0, lunes: 1, martes: 2, 'miércoles': 3, miercoles: 3, jueves: 4, viernes: 5, 'sábado': 6, sabado: 6 };
function interpretar(texto) {
  let s = ' ' + texto + ' ';
  const r = {};
  function quitar(re) { s = s.replace(re, ' '); }
  let m;
  if ((m = s.match(/\s(para\s+)?pasado\s+ma[ñn]ana\b/i))) { r.fecha = sumarDias(hoy(), 2); quitar(m[0]); }
  else if ((m = s.match(/\s(para\s+)?(el\s+)?d[ií]a\s+de\s+hoy\b|\s(para\s+)?hoy\b/i))) { r.fecha = hoy(); quitar(m[0]); }
  else if ((m = s.match(/\s(para\s+)?ma[ñn]ana\b/i))) { r.fecha = sumarDias(hoy(), 1); quitar(m[0]); }
  else if ((m = s.match(/\s(para\s+)?la\s+pr[oó]xima\s+semana\b/i))) { r.fecha = proximoDia(1); quitar(m[0]); }
  else if ((m = s.match(/\s(para\s+)?(el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|se?tiembre|octubre|noviembre|diciembre)\b/i))) {
    const mes = MESES_LARGO.indexOf(m[4].toLowerCase().replace('septiembre', 'setiembre'));
    const h = deISO(hoy());
    let f = new Date(h.getFullYear(), mes, Number(m[3]));
    if (aISO(f) < hoy()) f = new Date(h.getFullYear() + 1, mes, Number(m[3]));
    r.fecha = aISO(f); quitar(m[0]);
  }
  else if ((m = s.match(/\s(para\s+)?(el\s+)?(pr[oó]ximo\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i))) {
    r.fecha = proximoDia(NUM_DIA[m[4].toLowerCase()]); quitar(m[0]);
  }
  else if ((m = s.match(/\s(para\s+)?el\s+(\d{1,2})\b(?!\s*(kg|kilos|%|soles))/i))) {
    const dia = Number(m[2]);
    if (dia >= 1 && dia <= 31) {
      const h = deISO(hoy());
      let f = new Date(h.getFullYear(), h.getMonth(), dia);
      if (aISO(f) < hoy()) f = new Date(h.getFullYear(), h.getMonth() + 1, dia);
      r.fecha = aISO(f); quitar(m[0]);
    }
  }
  if ((m = s.match(/\s(es\s+)?(urgente|important[ei]simo|important[ei]|prioridad\s+alta)\b/i))) { r.prioridad = 'Alta'; quitar(m[0]); }
  else if ((m = s.match(/\s(prioridad\s+baja|sin\s+apuro|cuando\s+pueda)\b/i))) { r.prioridad = 'Baja'; quitar(m[0]); }
  let t = s.replace(/\s+/g, ' ').trim().replace(/^[,.;:\-\s]+|[,.;:\-\s]+$/g, '');
  r.titulo = t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  return r;
}

/* ---------- Voz ---------- */
let reconocedor = null;
function dictar(txt, f) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('mic');
  if (reconocedor) { pararVoz(); return; }
  if (!SR) { usarTeclado(txt); return; }
  try {
    reconocedor = new SR();
    reconocedor.lang = 'es-PE';
    reconocedor.interimResults = true;
    reconocedor.continuous = false;
    const base = txt.value ? txt.value.trim() + ' ' : '';
    reconocedor.onresult = function (e) {
      let dicho = '';
      for (let i = 0; i < e.results.length; i++) dicho += e.results[i][0].transcript;
      txt.value = base + dicho;
      aplicarDeteccion(f, txt.value);
    };
    reconocedor.onerror = function (e) {
      pararVoz();
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') usarTeclado(txt);
    };
    reconocedor.onend = function () { pararVoz(); };
    reconocedor.start();
    mic.classList.add('on');
  } catch (err) { pararVoz(); usarTeclado(txt); }
}
function pararVoz() {
  if (reconocedor) { try { reconocedor.stop(); } catch (e) {} reconocedor = null; }
  const mic = document.getElementById('mic');
  if (mic) mic.classList.remove('on');
}
function usarTeclado(txt) {
  txt.focus();
  toast('Toca el micrófono de tu teclado para dictar');
}
