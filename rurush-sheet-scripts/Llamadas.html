<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#111111">
<style>
  :root { --bg:#111; --card:#1c1c1e; --line:#2c2c2e; --tx:#f2f2f2; --mut:#9a9a9f; --red:#e53935; --grn:#34c759; --ice:#64b5f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px -apple-system, system-ui, Roboto, sans-serif; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:19px; margin:0; } h1 b { color:var(--red); }
  .sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .btn-s { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:15px; }
  .marcador { display:flex; gap:6px; overflow-x:auto; margin-top:10px; }
  .bases { width:100%; margin-top:10px; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:15px; }
  .m { flex:none; background:var(--card); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--mut); }
  .m b { color:var(--tx); font-size:15px; margin-right:3px; }
  main { padding:14px 16px 40px; }
  .card { background:var(--card); border-radius:16px; padding:16px; }
  .nombre { font-size:22px; font-weight:700; word-break:break-word; }
  .num { color:var(--mut); margin-top:4px; font-size:15px; }
  .meta { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { padding:2px 8px; border-radius:8px; font-size:12px; background:var(--line); color:var(--mut); }
  .acciones { display:grid; grid-template-columns:3fr 3fr 1fr; gap:8px; margin:16px 0 4px; }
  .llamar, .wacall, .wa { display:flex; align-items:center; justify-content:center; gap:8px; border-radius:14px; padding:16px; font-size:18px; font-weight:700; text-decoration:none; }
  .llamar { background:var(--grn); color:#062b12; white-space:nowrap; padding:16px 6px; } .wacall { background:#25d366; color:#062b12; font-size:15px; gap:4px; padding:16px 6px; white-space:nowrap; } .wa { background:#1f3d2b; color:var(--grn); }
  h2 { font-size:13px; color:var(--mut); font-weight:600; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .hist { font-size:13px; color:var(--mut); border-left:2px solid var(--line); padding-left:10px; }
  .hist div { margin:4px 0; } .hist b { color:var(--tx); font-weight:600; }
  .estados { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .est { background:var(--card); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:13px 8px; font-size:15px; }
  .est.on { border-color:var(--ice); background:#13293d; color:#fff; font-weight:700; }
  textarea, select, input { width:100%; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:12px; padding:12px; font-family:inherit; font-size:16px; }
  textarea { min-height:84px; resize:vertical; }
  .tip { color:var(--mut); font-size:12px; margin-top:6px; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .medidor { margin-top:10px; font-size:14px; color:var(--mut); display:flex; gap:12px; }
  .medidor b { color:var(--tx); }
  .est:disabled { opacity:.35; }
  .est small { display:block; font-size:11px; color:var(--mut); margin-top:2px; }
  .guardar { width:100%; margin-top:16px; background:var(--red); color:#fff; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:700; }
  .guardar:disabled { opacity:.45; }
  .socio { margin-top:10px; padding:10px 12px; border-radius:10px; background:#12391f; color:#7ee2a0; font-size:14px; }
  .socio.exsocio { background:#2a2a2a; color:#ccc; }
  .socio button { display:block; width:100%; margin-top:8px; padding:10px; border:0; border-radius:8px; background:#1f7a3f; color:#fff; font-size:15px; font-weight:600; }
  .saltar { width:100%; margin-top:8px; background:none; border:0; color:var(--mut); padding:10px; font-size:14px; }
  .toast { white-space:pre-line; position:fixed; left:16px; right:16px; bottom:16px; background:#2c2c2e; color:#fff; padding:12px 14px; border-radius:12px; font-size:14px; display:none; z-index:20; }
  .toast.err { background:#5c1f1f; }
  .vacio { text-align:center; color:var(--mut); padding:60px 10px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .tab { background:var(--card); color:var(--mut); border:1px solid var(--line); border-radius:10px; padding:9px; font-size:15px; font-weight:600; }
  .tab.on { background:#2a1414; border-color:var(--red); color:#fff; }
  .totales { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tot { background:var(--card); border-radius:14px; padding:12px; } .tot b { display:block; font-size:22px; margin-top:2px; } .tot span { color:var(--mut); font-size:12px; }
  .tot.atr b { color:var(--red); }
  .cobro { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .cobro .arriba { display:flex; gap:10px; align-items:flex-start; }
  .cobro .btns { display:grid; grid-template-columns:1.15fr 1fr 1.15fr; gap:6px; margin-top:10px; }
  .cobro .btns a, .cobro .btns button { display:flex; white-space:nowrap; align-items:center; justify-content:center; gap:4px; border-radius:10px; padding:9px 4px; font-size:14px; font-weight:600; text-decoration:none; border:0; background:var(--line); color:var(--tx); }
  .cobro .d { flex:1; min-width:0; } .cobro .n { font-weight:700; word-break:break-word; } .cobro .s { color:var(--mut); font-size:13px; margin-top:2px; }
  .cobro .mt { font-weight:700; font-size:17px; text-align:right; white-space:nowrap; }
  .cobro .f { font-size:12px; color:var(--mut); text-align:right; margin-top:2px; } .cobro .f.atr { color:var(--red); font-weight:600; } .cobro .f.hoy { color:#ffcc00; font-weight:600; }
  .cobro .btns .ok { background:#1f3d2b; color:var(--grn); font-weight:700; }
  .nuevo { width:100%; background:var(--red); color:#fff; border:0; border-radius:14px; padding:14px; font-size:16px; font-weight:700; margin-bottom:6px; }
  .buscar { display:grid; grid-template-columns:1fr auto; gap:8px; } .buscar button { background:var(--ice); color:#04121f; border:0; border-radius:12px; padding:0 16px; font-weight:700; font-size:15px; }
  .sa { display:inline-block; white-space:nowrap; margin-top:4px; font-size:12px; padding:1px 7px; border-radius:7px; background:var(--line); color:var(--mut); }
  .sa.med { background:#3a2e10; color:#ffcc00; } .sa.alto { background:#3d1515; color:#ff6b6b; }
  .luego { margin:-16px -16px 14px; padding:12px 16px; border-radius:16px 16px 0 0; background:#3a2e10; color:#ffd666; font-size:14px; }
  .luego b { font-size:16px; }
  .card.esLuego { border:2px solid #ffcc00; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chips button { background:var(--line); color:var(--tx); border:0; border-radius:10px; padding:9px 12px; font-size:14px; }
  .m.prog { background:#3a2e10; color:#ffd666; } .m.prog b { color:#ffd666; }
  .confirmar { display:flex; gap:8px; align-items:center; background:#12391f; color:#7ee2a0; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  .confirmar a { flex:1; text-align:center; background:#25d366; color:#062b12; border-radius:10px; padding:10px; font-weight:700; text-decoration:none; }
  .confirmar button { background:none; border:0; color:#7ee2a0; font-size:18px; padding:4px 8px; }
  .aviso { background:#3a2e10; color:#ffd666; border-radius:10px; padding:10px; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1><b>RURUSH</b> Llamadas</h1><div class="sub" id="sub">Hola <?= asesora ?></div></div>
    <button class="btn-s" id="recargar">🔄</button>
  </div>
  <div class="tabs"><button class="tab on" data-v="llamadas">📞 Llamadas</button><button class="tab" data-v="cobros">💰 Cobros</button></div>
  <div id="vistaLlamadas"><select class="bases" id="base"></select>
  <div class="marcador" id="marcador"></div></div>
</header>
<main id="main"><div class="vacio">Cargando tu cola…</div></main>
<div class="toast" id="toast"></div>

<script>
// id de ESTE celular (se crea una vez y queda guardado en el navegador) → candado por celular
// OJO: dentro de textos `...` escribir https:\/\/ y no la doble barra: Google la toma como comentario y la app no arranca.
const DISP = (() => { try { let d = localStorage.getItem('rr_disp'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now()).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 32); localStorage.setItem('rr_disp', d); } return d; } catch (e) { return ''; } })();
// Huella del celular (sin datos personales): sirve para reconocerlo si el navegador pierde DISP.
const HUELLA = (() => {
  const s = [navigator.platform, screen.width + 'x' + screen.height, window.devicePixelRatio, navigator.hardwareConcurrency || '',
    navigator.maxTouchPoints || '', navigator.language, (Intl.DateTimeFormat().resolvedOptions().timeZone || ''),
    navigator.userAgent.replace(/[\d_.]+/g, '')].join('|');
  let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
})();
const LLAVE = <?!= JSON.stringify(llave) ?> + '|' + DISP + '|' + HUELLA;
const ASESORA = <?!= JSON.stringify(asesora) ?>;
const BASES = <?!= JSON.stringify(bases) ?>;
// base elegida (se recuerda en el celular)
let BASE = (() => { try { const b = localStorage.getItem('rr_base_' + ASESORA); return BASES.indexOf(b) >= 0 ? b : BASES[0]; } catch (e) { return BASES[0]; } })();
let enVuelo = {};
let PROG = [];      // mis llamadas programadas que todavía no tocan (⏰ llamar luego)   // guardados que todavía no responde el servidor, por estado
let mostrando = false, cola = [], idx = 0, estado = null, ESTADOS = [], HORAS = [], hoy = {}, pend = null, trayendo = false;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(t, err) {
  const el = $('#toast'); el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', err ? 6000 : 2200);
}

// Link de prueba de Omar: puede ver la cola de una asesora ("ver como"); nada se guarda.
let COMO = '';
const claveLocal = () => 'rr_cola_' + ASESORA + (COMO ? '_' + COMO : '') + '_' + BASE;
function guardarLocal() {
  try { localStorage.setItem(claveLocal(), JSON.stringify({ dia: new Date().toDateString(), cola: cola.slice(idx), ESTADOS, HORAS })); } catch (e) {}
}
function leerLocal() {
  try {
    const c = JSON.parse(localStorage.getItem(claveLocal()) || 'null');
    if (c && c.dia === new Date().toDateString() && c.cola && c.cola.length) return c;
  } catch (e) {}
  return null;
}

let vigia = null;
function vigilar(t0, que) {
  clearInterval(vigia);
  vigia = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (!trayendo) return clearInterval(vigia);
    if (s >= 15) $('#sub').textContent = `⏳ ${que}… ${s} s (el Sheet está lento)`;
    if (s >= 90) { clearInterval(vigia); trayendo = false; toast('El servidor no respondió en 90 s. Toca 🔄 para reintentar y avisa a Omar.', true); }
  }, 1000);
}
function traer(reset) {
  if (trayendo) return; trayendo = true;
  const excluir = reset ? [] : cola.slice(idx).map((x) => x.fila);
  const t0 = Date.now(), base = BASE;
  vigilar(t0, 'Cargando tu cola');
  google.script.run
    .withSuccessHandler((r) => {
      trayendo = false;
      if (base !== BASE) return;   // cambió de base mientras cargaba
      ESTADOS = r.estados; HORAS = r.horas; pend = r.pendientes; PROG = r.programadas || [];
      // el servidor aún no cuenta las llamadas que se están guardando: se suman para que el marcador no baje
      hoy = Object.assign({}, r.hoy); Object.keys(enVuelo).forEach((k) => { hoy[k] = (hoy[k] || 0) + enVuelo[k]; });
      r.cola.forEach((x) => { x.base = base; });   // cada persona recuerda de qué base salió
      if (reset) {
        // si ya se estaba mostrando la cola guardada, no cambiarle la persona en pantalla
        const enPantalla = actual();
        cola = r.cola; idx = 0;
        const igual = (x) => (x.base || base) === (enPantalla.base || base) && x.fila === enPantalla.fila;
        // ⏰ si llegó una llamada programada y la asesora aún no llamó a quien tiene en pantalla, la programada va primero
        const ceder = cola[0] && cola[0].luego && !llamada.intentos;
        if (enPantalla) {
          const j = cola.findIndex(igual);
          if (j >= 0) cola.splice(j, 1);
          cola.splice(ceder ? 1 : 0, 0, enPantalla);
        }
        if (enPantalla && ceder && VISTA === 'llamadas') pintar();
      } else {
        const ya = {}; cola.forEach((x) => { ya[(x.base || base) + ':' + x.fila] = true; });
        cola = cola.concat(r.cola.filter((x) => !ya[x.base + ':' + x.fila]));
      }
      guardarLocal();
      $('#sub').textContent = `Hola ${ASESORA} · cargó en ${((Date.now() - t0) / 1000).toFixed(1)} s${r.api === false ? ' · lectura lenta (falta servicio Sheets)' : ''}${r.descartados != null ? ` · 🚫 ${r.descartados} descartados ocultos` : ''}`;
      if (!cobros && !cargandoCobros) setTimeout(traerCobros, 500);   // deja lista la pestaña Cobros
      pintarMarcador();
      if (VISTA === 'llamadas' && (!mostrando || !actual())) { mostrando = true; pintar(); }
    })
    .withFailureHandler((e) => { trayendo = false; if (/CELULAR_NO_AUTORIZADO/.test(e.message || e)) return google.script.run.withSuccessHandler(pantallaPin).app_estadoCelular(LLAVE); toast(e.message || String(e), true); if (!cola.length && VISTA === 'llamadas') $('#main').innerHTML = `<div class="vacio">${esc(e.message || e)}</div>`; })
    .app_getCola(LLAVE, BASE, excluir, false, COMO);
}

const actual = () => cola[idx];

// Tiempo mínimo en el marcador para poder marcar cada resultado (igual que en el servidor).
const MIN_SEG = { 'APAGADO': 0, 'NO CONTESTO': 15, 'CORTO': 15, 'CONTESTO': 30, 'AGENDADO': 30, 'CLIENTE': 30, 'DESCARTADO': 10, 'Otra Ciudad': 30, 'LLAMAR LUEGO': 10 };
let llamada = { fila: null, intentos: 0, fueraMs: 0, salio: null, toco: 0, wa: 0 };
const segundos = () => Math.round(llamada.fueraMs / 1000);
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function guardarLlamada() { try { localStorage.setItem('rr_llamada', JSON.stringify(llamada)); } catch (e) {} }
function nuevaLlamada(fila) {
  try {
    const g = JSON.parse(localStorage.getItem('rr_llamada') || 'null');
    if (g && g.fila === fila) { llamada = g; if (llamada.salio) { llamada.fueraMs += Date.now() - llamada.salio; llamada.salio = null; } return; }
  } catch (e) {}
  llamada = { fila, intentos: 0, fueraMs: 0, salio: null, toco: 0, wa: 0 };
}
// La app pasa a segundo plano cuando se abre el marcador, y vuelve al colgar.
function salioDeLaApp() {
  if (llamada.salio == null && llamada.toco && Date.now() - llamada.toco < 20000) { llamada.salio = Date.now(); guardarLlamada(); }
}
function volvioALaApp() {
  if (llamada.salio != null) { llamada.fueraMs += Date.now() - llamada.salio; llamada.salio = null; guardarLlamada(); actualizarBotones(); }
}
document.addEventListener('visibilitychange', () => (document.hidden ? salioDeLaApp() : volvioALaApp()));
window.addEventListener('blur', salioDeLaApp);
window.addEventListener('focus', volvioALaApp);

function actualizarBotones() {
  const seg = segundos();
  const med = $('#medidor');
  if (med) med.innerHTML = llamada.intentos
    ? `<span>📞 Intentos: <b>${llamada.intentos}</b></span><span>⏱ En llamada: <b>${mmss(seg)}</b></span>`
    : '<span>Toca 📞 Llamar o 📲 WhatsApp para habilitar los resultados</span>';
  document.querySelectorAll('.est').forEach((b) => {
    const min = MIN_SEG[b.dataset.e] || 0;
    const ok = llamada.intentos > 0 && llamada.salio == null && seg >= min;
    b.disabled = !ok;
    b.querySelector('small').textContent = ok ? '' : (llamada.intentos ? `🔒 mín. ${min} s` : '🔒');
    if (!ok && estado === b.dataset.e) { estado = null; b.classList.remove('on'); $('#guardar').disabled = true; }
  });
}

function pintarMarcador() {
  const total = Object.values(hoy).reduce((a, b) => a + b, 0);
  const cont = (hoy.CONTESTO || 0) + (hoy.CORTO || 0) + (hoy.AGENDADO || 0) + (hoy.CLIENTE || 0);
  $('#marcador').innerHTML =
    `<div class="m"><b>${total}</b>llamadas hoy</div><div class="m"><b>${cont}</b>contestaron</div>` +
    `<div class="m"><b>${hoy.AGENDADO || 0}</b>agendados</div>` +
    `<div class="m"><b>${Math.max(cola.length - idx, 0)}</b>en tu cola</div>` +
    (PROG.length ? `<div class="m prog" id="verProg"><b>${PROG.length}</b>⏰ programadas</div>` : '');
  const vp = $('#verProg');
  if (vp) vp.onclick = () => toast(PROG.map((x) => `⏰ ${x.texto} · ${x.nombre && !/^[+\d\s()-]+$/.test(x.nombre) ? x.nombre : x.numero}`).join('\n'));
}

// Socio con plan vigente (vence hoy o después): se puede marcar CLIENTE sin llamar. Vencido = ex-socio.
const hoyIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const socioVigente = (s) => !!(s.vence && s.vence >= hoyIso());
const datosSocio = (s) => (s.plan ? ' · ' + esc(s.plan) : '') + (s.vence ? ' · ' + (socioVigente(s) ? 'vence ' : 'venció ') + esc(s.vence.slice(8, 10) + '/' + s.vence.slice(5, 7) + '/' + s.vence.slice(2, 4)) : '') + (s.asesor ? ' · ' + esc(s.asesor) : '');
function pintar() {
  const p = actual();
  estado = null;
  if (!p) { $('#main').innerHTML = '<div class="vacio">🎉 No hay más personas en tu cola por ahora.<br><br>Toca 🔄 para buscar de nuevo.</div>'; return; }
  const esNum = /^[+\d\s()-]+$/.test(p.nombre);
  const hist = p.rondas.length
    ? `<h2>Llamadas anteriores</h2><div class="hist">${p.rondas.map((r) => `<div><b>${r.n}ª</b> · ${esc(r.fecha)} · ${esc(r.asesor)} · <b>${esc(r.estado)}</b>${r.obs ? ' — ' + esc(r.obs) : ''}</div>`).join('')}</div>`
    : '';
  const fp = true ? `<div id="fpbox" style="display:none"><h2>Fecha y hora del Free Pass</h2>
      <div class="fila2"><input type="date" id="fpf"><select id="fph"><option value="">Hora</option>${HORAS.map((h) => `<option>${h}</option>`).join('')}</select></div></div>` : '';
  $('#main').innerHTML = bannerConfirmar() + `
    <div class="card${p.luego ? ' esLuego' : ''}">
      ${p.luego ? `<div class="luego">🔔 <b>LLAMAR AHORA</b> · pidió ${esc(p.luego.texto)}${p.luego.nota ? `<br>📝 ${esc(p.luego.nota)}` : ''}<br>Lo atendió ${esc(p.luego.asesora)}</div>` : ''}
      <div class="nombre">${esc(esNum || !p.nombre ? 'Sin nombre' : p.nombre)}</div>
      <div class="num">+51 ${esc(p.numero.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3'))}</div>
      <div class="meta"><span class="tag">${p.ronda}ª llamada</span>${p.dia ? `<span class="tag">lead del ${esc(p.dia)}</span>` : ''}${p.origen ? `<span class="tag">${esc(p.origen)}</span>` : ''}</div>
      <div class="acciones">
        <a class="llamar" id="llamar" href="tel:+51${p.numero}">📞 Llamar</a>
        <a class="wacall" id="wacall" href="https:\/\/wa.me/51${p.numero}" target="_blank">📲 WhatsApp</a>
        <a class="wa" href="https:\/\/wa.me/51${p.numero}" target="_blank">💬</a>
      </div>
      ${p.socio ? (socioVigente(p.socio)
        ? `<div class="socio">🟢 <b>YA ES SOCIO</b>${datosSocio(p.socio)}<button id="esSocio">✅ Marcar CLIENTE sin llamar</button></div>`
        : `<div class="socio exsocio">⚪ <b>EX-SOCIO</b>${datosSocio(p.socio)}<br>Su plan ya venció: llámalo para que regrese.</div>`) : ''}
      <div class="medidor" id="medidor"></div>
    </div>
    ${hist}
    <h2>¿Cómo salió?</h2>
    <div class="estados">${ESTADOS.map((e) => `<button class="est" data-e="${esc(e)}" disabled>${esc(e)}<small></small></button>`).join('')}</div>
    ${fp}

// 📲 Confirmación del Free Pass desde el WhatsApp de la asesora (además, la línea principal manda la suya).
let CONFIRMAR = null;
const DIAS_SEM = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const GPS_RURUSH = 'https:\/\/maps.app.goo.gl/x2K9xZYXsLtzhxuW6';
function textoConfirmacion(c) {
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hoyD = new Date(), man = new Date(Date.now() + 864e5);

  const dia = c.fecha === iso(hoyD) ? 'Hoy' : c.fecha === iso(man) ? 'Mañana' : DIAS_SEM[f.getDay()] + ' ' + c.fecha.slice(8) + '/' + c.fecha.slice(5, 7);
  const primero = String(c.nombre || '').trim().split(/\s+/)[0] || '';
  const n = /^[a-záéíóúñ]{2,}$/i.test(primero) ? primero[0].toUpperCase() + primero.slice(1).toLowerCase() : '';
  const yo = ({ MONICA: 'Mónica', ALVARO: 'Álvaro' })[ASESORA] || ASESORA[0] + ASESORA.slice(1).toLowerCase();
  return `¡Hola${n ? ' ' + n : ''}! 💪 Soy ${yo} de RURUSH Fitness Club 🔥\nTe confirmo tu Free Pass:\n📅 ${dia}${c.hora ? ' a las ' + c.hora : ''}\n`

}

// Guardado en segundo plano: la asesora pasa a la siguiente sin esperar.
function guardar() {

  const obs = (llamada.wa ? '📲 WA ' : '') + $('#obs').value;

  const e = estado;

    if (!luego) return toast('⏰ Elige a qué hora lo llamamos.', true);
    if (luego < Date.now()) return toast('⏰ Esa hora ya pasó.', true);
  }
  const intentos = llamada.intentos, seg = segundos();
  try { localStorage.removeItem('rr_llamada'); } catch (err) {}
  const k = e === 'LLAMAR LUEGO' ? 'CONTESTO' : e;   // en el Sheet queda como CONTESTO
  hoy[k] = (hoy[k] || 0) + 1; enVuelo[k] = (enVuelo[k] || 0) + 1; pintarMarcador();
  CONFIRMAR = e === 'AGENDADO' && fpf ? { numero: p.numero, nombre: p.nombre, fecha: fpf, hora: fph } : null;
  idx++; pintar(); revisarCola(); guardarLocal();
  google.script.run
    .withSuccessHandler((r) => {

      const texto = new Date(luego).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: 'numeric', minute: '2-digit' });
      PROG.push({ ms: luego, texto, nombre: p.nombre, numero: p.numero }); PROG.sort((a, b) => a.ms - b.ms);
      pintarMarcador(); toast(`⏰ Programada: ${texto}. A esa hora te sale primero.`);
    })
    .withFailureHandler((err) => { enVuelo[k]--; hoy[k]--; pintarMarcador(); toast(`No se guardó (${p.numero}): ${err.message || err}`, true); })
    .app_guardar(LLAVE, p.base || BASE, p.fila, p.numero, e, obs, fpf, fph, intentos, seg, luego, p.nombre);
}

          <button class="guardar" data-i="${i}">📋 Copiar link</button></div>`).join('') +
          '<button class="saltar" id="volver">← Volver a la cola</button>';
        document.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => {
          const t = l[b.dataset.i].link;
          (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('📋 Copiado')).catch(() => prompt('Copia el link:', t));
        });
        $('#volver').onclick = () => { mostrando = false; pintar(); };
      })
      .withFailureHandler((e) => toast(e.message || String(e), true))
      .app_links(LLAVE);
  };
  $('#errores').onclick = () => {
    $('#main').innerHTML = '<div class="vacio">Cargando errores…</div>';
    google.script.run
      .withSuccessHandler((lista) => {
        $('#main').innerHTML = '<h2>🛠 Últimos errores de la app</h2>' + (lista.length ? lista.map((x) =>
          `<div class="card" style="margin-bottom:8px"><div class="num"><b>${esc(x.asesora)}</b> · ${esc(x.fecha)} ${esc(x.hora)} · ${esc(x.accion)}</div>
          <div class="tip">${esc(x.base)}${x.fila ? ' · fila ' + esc(x.fila) : ''}${x.celular ? ' · ' + esc(x.celular) : ''}${x.estado ? ' · ' + esc(x.estado) : ''}</div>
          <div style="color:#ff8a80;margin-top:4px">${esc(x.error)}</div></div>`).join('') : '<div class="vacio">Sin errores registrados 👌</div>') +
          '<button class="saltar" id="volver">← Volver a la cola</button>';
        $('#volver').onclick = () => { mostrando = false; pintar(); };
      })
      .withFailureHandler((e) => toast(e.message || String(e), true))
      .app_errores(LLAVE);
  };
}
function iniciar() {
  // Al abrir: si hay una cola guardada de hoy, se muestra al instante y se actualiza por detrás.
  const local = leerLocal();
  if (local) { cola = local.cola; ESTADOS = local.ESTADOS; HORAS = local.HORAS; mostrando = true; pintar(); pintarMarcador(); }
  traer(true);
}
function pantallaPin(r) {
  $('#base').style.display = 'none';
  $('#main').innerHTML = `<div class="card" style="margin-top:20px">
    <div class="nombre">🔒 Celular no autorizado</div>
    <div class="num" style="margin-top:8px">Este link de <b>${esc(r.asesora)}</b> solo funciona en su celular.
    ${r.tiene ? 'Ya hay un celular activado desde el ' + esc(r.desde) + '. Si activas este, el otro deja de funcionar.' : ''}</div>
    <div class="tip" style="margin:14px 0 6px">PIN de Omar para activar este celular:</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="guardar" id="activar">Activar este celular</button></div>`;
  $('#activar').onclick = () => {
    $('#activar').disabled = true;
    google.script.run
      .withSuccessHandler(() => { toast('✓ Celular activado'); $('#base').style.display = ''; $('#main').innerHTML = '<div class="vacio">Cargando tu cola…</div>'; iniciar(); })
      .withFailureHandler((e) => { $('#activar').disabled = false; toast('⚠️ ' + (e.message || e), true); })
      .app_activarCelular(LLAVE, $('#pin').value, navigator.userAgent);
  };
}
if (!DISP) $('#main').innerHTML = '<div class="vacio">⚠️ Este navegador no guarda datos (¿modo incógnito?). Ábrelo en Chrome normal.</div>';
// Pide la cola de una vez (una vuelta menos al servidor): si el celular no está autorizado,
// traer() recibe CELULAR_NO_AUTORIZADO y muestra la pantalla del PIN.
else iniciar();
</script>
