<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#111111">
<style>
  :root { --bg:#111; --card:#1c1c1e; --line:#2c2c2e; --tx:#f2f2f2; --mut:#9a9a9f; --red:#e53935; --grn:#34c759; --ice:#64b5f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px -apple-system, system-ui, Roboto, sans-serif; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:19px; margin:0; } h1 b { color:var(--red); }
  .sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .btn-s { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:15px; }
  .marcador { display:flex; gap:6px; overflow-x:auto; margin-top:10px; }
  .bases { width:100%; margin-top:10px; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:15px; }
  .m { flex:none; background:var(--card); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--mut); }
  .m b { color:var(--tx); font-size:15px; margin-right:3px; }
  main { padding:14px 16px 40px; }
  .card { background:var(--card); border-radius:16px; padding:16px; }
  .nombre { font-size:22px; font-weight:700; word-break:break-word; }
  .num { color:var(--mut); margin-top:4px; font-size:15px; }
  .meta { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { padding:2px 8px; border-radius:8px; font-size:12px; background:var(--line); color:var(--mut); }
  .acciones { display:grid; grid-template-columns:3fr 3fr 1fr; gap:8px; margin:16px 0 4px; }
  .llamar, .wacall, .wa { display:flex; align-items:center; justify-content:center; gap:8px; border-radius:14px; padding:16px; font-size:18px; font-weight:700; text-decoration:none; }
  .llamar { background:var(--grn); color:#062b12; white-space:nowrap; padding:16px 6px; } .wacall { background:#25d366; color:#062b12; font-size:15px; gap:4px; padding:16px 6px; white-space:nowrap; } .wa { background:#1f3d2b; color:var(--grn); }
  h2 { font-size:13px; color:var(--mut); font-weight:600; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .hist { font-size:13px; color:var(--mut); border-left:2px solid var(--line); padding-left:10px; }
  .hist div { margin:4px 0; } .hist b { color:var(--tx); font-weight:600; }
  .estados { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .est { background:var(--card); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:13px 8px; font-size:15px; }
  .est.on { border-color:var(--ice); background:#13293d; color:#fff; font-weight:700; }
  textarea, select, input { width:100%; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:12px; padding:12px; font-family:inherit; font-size:16px; }
  textarea { min-height:84px; resize:vertical; }
  .tip { color:var(--mut); font-size:12px; margin-top:6px; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .medidor { margin-top:10px; font-size:14px; color:var(--mut); display:flex; gap:12px; }
  .medidor b { color:var(--tx); }
  .est:disabled { opacity:.35; }
  .est small { display:block; font-size:11px; color:var(--mut); margin-top:2px; }
  .guardar { width:100%; margin-top:16px; background:var(--red); color:#fff; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:700; }
  .guardar:disabled { opacity:.45; }
  .saltar { width:100%; margin-top:8px; background:none; border:0; color:var(--mut); padding:10px; font-size:14px; }
  .toast { position:fixed; left:16px; right:16px; bottom:16px; background:#2c2c2e; color:#fff; padding:12px 14px; border-radius:12px; font-size:14px; display:none; z-index:20; }
  .toast.err { background:#5c1f1f; }
  .vacio { text-align:center; color:var(--mut); padding:60px 10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1><b>RURUSH</b> Llamadas</h1><div class="sub" id="sub">Hola <?= asesora ?></div></div>
    <button class="btn-s" id="recargar">🔄</button>
  </div>
  <select class="bases" id="base"></select>
  <div class="marcador" id="marcador"></div>
</header>
<main id="main"><div class="vacio">Cargando tu cola…</div></main>
<div class="toast" id="toast"></div>

<script>
// id de ESTE celular (se crea una vez y queda guardado en el navegador) → candado por celular
const DISP = (() => { try { let d = localStorage.getItem('rr_disp'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now()).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 32); localStorage.setItem('rr_disp', d); } return d; } catch (e) { return ''; } })();
const LLAVE = <?!= JSON.stringify(llave) ?> + '|' + DISP;
const ASESORA = <?!= JSON.stringify(asesora) ?>;
const BASES = <?!= JSON.stringify(bases) ?>;
// base elegida (se recuerda en el celular)
let BASE = (() => { try { const b = localStorage.getItem('rr_base_' + ASESORA); return BASES.indexOf(b) >= 0 ? b : BASES[0]; } catch (e) { return BASES[0]; } })();
let mostrando = false, cola = [], idx = 0, estado = null, ESTADOS = [], HORAS = [], hoy = {}, pend = null, trayendo = false;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(t, err) {
  const el = $('#toast'); el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', err ? 6000 : 2200);
}

const claveLocal = () => 'rr_cola_' + ASESORA + '_' + BASE;
function guardarLocal() {
  try { localStorage.setItem(claveLocal(), JSON.stringify({ dia: new Date().toDateString(), cola: cola.slice(idx), ESTADOS, HORAS })); } catch (e) {}
}
function leerLocal() {
  try {
    const c = JSON.parse(localStorage.getItem(claveLocal()) || 'null');
    if (c && c.dia === new Date().toDateString() && c.cola && c.cola.length) return c;
  } catch (e) {}
  return null;
}

function traer(reset) {
  if (trayendo) return; trayendo = true;
  const excluir = reset ? [] : cola.slice(idx).map((x) => x.fila);
  const t0 = Date.now(), base = BASE;
  google.script.run
    .withSuccessHandler((r) => {
      trayendo = false;
      if (base !== BASE) return;   // cambió de base mientras cargaba
      ESTADOS = r.estados; HORAS = r.horas; hoy = r.hoy; pend = r.pendientes;
      if (reset) {
        // si ya se estaba mostrando la cola guardada, no cambiarle la persona en pantalla
        const enPantalla = actual();
        cola = r.cola; idx = 0;
        if (enPantalla) { const j = cola.findIndex((x) => x.fila === enPantalla.fila); if (j > 0) { cola.splice(j, 1); cola.unshift(enPantalla); } else if (j < 0) cola.unshift(enPantalla); }
      } else { cola = cola.concat(r.cola); }
      guardarLocal();
      $('#sub').textContent = `Hola ${ASESORA} · cargó en ${((Date.now() - t0) / 1000).toFixed(1)} s`;
      pintarMarcador();
      if (!mostrando || !actual()) { mostrando = true; pintar(); }
    })
    .withFailureHandler((e) => { trayendo = false; if (/CELULAR_NO_AUTORIZADO/.test(e.message || e)) return google.script.run.withSuccessHandler(pantallaPin).app_estadoCelular(LLAVE); toast(e.message || String(e), true); if (!cola.length) $('#main').innerHTML = `<div class="vacio">${esc(e.message || e)}</div>`; })
    .app_getCola(LLAVE, BASE, excluir);
}

const actual = () => cola[idx];

// Tiempo mínimo en el marcador para poder marcar cada resultado (igual que en el servidor).
const MIN_SEG = { 'APAGADO': 0, 'NO CONTESTO': 15, 'CORTO': 15, 'CONTESTO': 40, 'AGENDADO': 40, 'CLIENTE': 40, 'DESCARTADO': 40, 'Otra Ciudad': 40 };
let llamada = { fila: null, intentos: 0, fueraMs: 0, salio: null, toco: 0, wa: 0 };
const segundos = () => Math.round(llamada.fueraMs / 1000);
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function guardarLlamada() { try { localStorage.setItem('rr_llamada', JSON.stringify(llamada)); } catch (e) {} }
function nuevaLlamada(fila) {
  try {
    const g = JSON.parse(localStorage.getItem('rr_llamada') || 'null');
    if (g && g.fila === fila) { llamada = g; if (llamada.salio) { llamada.fueraMs += Date.now() - llamada.salio; llamada.salio = null; } return; }
  } catch (e) {}
  llamada = { fila, intentos: 0, fueraMs: 0, salio: null, toco: 0, wa: 0 };
}
// La app pasa a segundo plano cuando se abre el marcador, y vuelve al colgar.
function salioDeLaApp() {
  if (llamada.salio == null && llamada.toco && Date.now() - llamada.toco < 20000) { llamada.salio = Date.now(); guardarLlamada(); }
}
function volvioALaApp() {
  if (llamada.salio != null) { llamada.fueraMs += Date.now() - llamada.salio; llamada.salio = null; guardarLlamada(); actualizarBotones(); }
}
document.addEventListener('visibilitychange', () => (document.hidden ? salioDeLaApp() : volvioALaApp()));
window.addEventListener('blur', salioDeLaApp);
window.addEventListener('focus', volvioALaApp);

function actualizarBotones() {
  const seg = segundos();
  const med = $('#medidor');
  if (med) med.innerHTML = llamada.intentos
    ? `<span>📞 Intentos: <b>${llamada.intentos}</b></span><span>⏱ En llamada: <b>${mmss(seg)}</b></span>`
    : '<span>Toca 📞 Llamar o 📲 WhatsApp para habilitar los resultados</span>';
  document.querySelectorAll('.est').forEach((b) => {
    const min = MIN_SEG[b.dataset.e] || 0;
    const ok = llamada.intentos > 0 && llamada.salio == null && seg >= min;
    b.disabled = !ok;
    b.querySelector('small').textContent = ok ? '' : (llamada.intentos ? `🔒 mín. ${min} s` : '🔒');
    if (!ok && estado === b.dataset.e) { estado = null; b.classList.remove('on'); $('#guardar').disabled = true; }
  });
}

function pintarMarcador() {
  const total = Object.values(hoy).reduce((a, b) => a + b, 0);
  const cont = (hoy.CONTESTO || 0) + (hoy.CORTO || 0) + (hoy.AGENDADO || 0) + (hoy.CLIENTE || 0);
  $('#marcador').innerHTML =
    `<div class="m"><b>${total}</b>llamadas hoy</div><div class="m"><b>${cont}</b>contestaron</div>` +
    `<div class="m"><b>${hoy.AGENDADO || 0}</b>agendados</div>` +
    `<div class="m"><b>${Math.max(cola.length - idx, 0)}</b>en tu cola</div>`;
}

function pintar() {
  const p = actual();
  estado = null;
  if (!p) { $('#main').innerHTML = '<div class="vacio">🎉 No hay más personas en tu cola por ahora.<br><br>Toca 🔄 para buscar de nuevo.</div>'; return; }
  const esNum = /^[+\d\s()-]+$/.test(p.nombre);
  const hist = p.rondas.length
    ? `<h2>Llamadas anteriores</h2><div class="hist">${p.rondas.map((r) => `<div><b>${r.n}ª</b> · ${esc(r.fecha)} · ${esc(r.asesor)} · <b>${esc(r.estado)}</b>${r.obs ? ' — ' + esc(r.obs) : ''}</div>`).join('')}</div>`
    : '';
  const fp = true ? `<div id="fpbox" style="display:none"><h2>Fecha y hora del Free Pass</h2>
      <div class="fila2"><input type="date" id="fpf"><select id="fph"><option value="">Hora</option>${HORAS.map((h) => `<option>${h}</option>`).join('')}</select></div></div>` : '';
  $('#main').innerHTML = `
    <div class="card">
      <div class="nombre">${esc(esNum || !p.nombre ? 'Sin nombre' : p.nombre)}</div>
      <div class="num">+51 ${esc(p.numero.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3'))}</div>
      <div class="meta"><span class="tag">${p.ronda}ª llamada</span>${p.dia ? `<span class="tag">lead del ${esc(p.dia)}</span>` : ''}${p.origen ? `<span class="tag">${esc(p.origen)}</span>` : ''}</div>
      <div class="acciones">
        <a class="llamar" id="llamar" href="tel:+51${p.numero}">📞 Llamar</a>
        <a class="wacall" id="wacall" href="https://wa.me/51${p.numero}" target="_blank">📲 WhatsApp</a>
        <a class="wa" href="https://wa.me/51${p.numero}" target="_blank">💬</a>
      </div>
      <div class="medidor" id="medidor"></div>
    </div>
    ${hist}
    <h2>¿Cómo salió?</h2>
    <div class="estados">${ESTADOS.map((e) => `<button class="est" data-e="${esc(e)}" disabled>${esc(e)}<small></small></button>`).join('')}</div>
    ${fp}
    <h2>Observación</h2>
    <textarea id="obs" placeholder="Toca aquí y usa el 🎤 del teclado para dictar"></textarea>
    <div class="tip">🎤 Toca el cuadro y el micrófono del teclado: habla y se escribe solo.</div>
    <button class="guardar" id="guardar" disabled>Guardar y siguiente</button>
    <button class="saltar" id="saltar">Saltar (no llamé)</button>`;
  document.querySelectorAll('.est').forEach((b) => b.onclick = () => {
    estado = b.dataset.e;
    document.querySelectorAll('.est').forEach((x) => x.classList.toggle('on', x === b));
    $('#guardar').disabled = false;
    const box = $('#fpbox'); if (box) box.style.display = estado === 'AGENDADO' ? 'block' : 'none';
  });
  $('#guardar').onclick = guardar;
  nuevaLlamada(BASE + ':' + p.fila);
  $('#llamar').onclick = () => { llamada.intentos++; llamada.toco = Date.now(); guardarLlamada(); actualizarBotones(); };
  // Llamada por WhatsApp: abre el chat (la asesora toca el 📞 de WhatsApp) y cuenta igual que una timbrada.
  $('#wacall').onclick = () => { llamada.intentos++; llamada.wa = (llamada.wa || 0) + 1; llamada.toco = Date.now(); guardarLlamada(); actualizarBotones(); };
  actualizarBotones();
  $('#saltar').onclick = () => { idx++; pintar(); revisarCola(); guardarLocal(); };
  window.scrollTo(0, 0);
}

// Guardado en segundo plano: la asesora pasa a la siguiente sin esperar.
function guardar() {
  const p = actual(); if (!p || !estado) return;
  const obs = (llamada.wa ? '📲 WA ' : '') + $('#obs').value;
  const fpf = $('#fpf') ? $('#fpf').value : '', fph = $('#fph') ? $('#fph').value : '';
  const e = estado;
  const intentos = llamada.intentos, seg = segundos();
  try { localStorage.removeItem('rr_llamada'); } catch (err) {}
  hoy[e] = (hoy[e] || 0) + 1; pintarMarcador();
  idx++; pintar(); revisarCola(); guardarLocal();
  google.script.run
    .withSuccessHandler(() => toast(`✓ Guardado: ${e}`))
    .withFailureHandler((err) => { hoy[e]--; pintarMarcador(); toast(`No se guardó (${p.numero}): ${err.message || err}`, true); })
    .app_guardar(LLAVE, BASE, p.fila, p.numero, e, obs, fpf, fph, intentos, seg);
}

function revisarCola() { if (cola.length - idx <= 5) traer(false); }

$('#recargar').onclick = () => { mostrando = false; cola = []; idx = 0; $('#main').innerHTML = '<div class="vacio">Cargando…</div>'; traer(true); };
// Selector de base: cada base tiene su propia cola
$('#base').innerHTML = BASES.map((b) => `<option ${b === BASE ? 'selected' : ''}>${esc(b)}</option>`).join('');
$('#base').onchange = () => {
  BASE = $('#base').value;
  try { localStorage.setItem('rr_base_' + ASESORA, BASE); } catch (e) {}
  trayendo = false; mostrando = false; cola = []; idx = 0;
  const l = leerLocal();
  if (l) { cola = l.cola; mostrando = true; pintar(); } else $('#main').innerHTML = '<div class="vacio">Cargando la base ' + esc(BASE) + '…</div>';
  traer(true);
};
function iniciar() {
  // Al abrir: si hay una cola guardada de hoy, se muestra al instante y se actualiza por detrás.
  const local = leerLocal();
  if (local) { cola = local.cola; ESTADOS = local.ESTADOS; HORAS = local.HORAS; mostrando = true; pintar(); pintarMarcador(); }
  traer(true);
}
function pantallaPin(r) {
  $('#base').style.display = 'none';
  $('#main').innerHTML = `<div class="card" style="margin-top:20px">
    <div class="nombre">🔒 Celular no autorizado</div>
    <div class="num" style="margin-top:8px">Este link de <b>${esc(r.asesora)}</b> solo funciona en su celular.
    ${r.tiene ? 'Ya hay un celular activado desde el ' + esc(r.desde) + '. Si activas este, el otro deja de funcionar.' : ''}</div>
    <div class="tip" style="margin:14px 0 6px">PIN de Omar para activar este celular:</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="guardar" id="activar">Activar este celular</button></div>`;
  $('#activar').onclick = () => {
    $('#activar').disabled = true;
    google.script.run
      .withSuccessHandler(() => { toast('✓ Celular activado'); $('#base').style.display = ''; $('#main').innerHTML = '<div class="vacio">Cargando tu cola…</div>'; iniciar(); })
      .withFailureHandler((e) => { $('#activar').disabled = false; toast('⚠️ ' + (e.message || e), true); })
      .app_activarCelular(LLAVE, $('#pin').value, navigator.userAgent);
  };
}
if (!DISP) $('#main').innerHTML = '<div class="vacio">⚠️ Este navegador no guarda datos (¿modo incógnito?). Ábrelo en Chrome normal.</div>';
else google.script.run
  .withSuccessHandler((r) => { if (r.ok) iniciar(); else pantallaPin(r); })
  .withFailureHandler((e) => { $('#main').innerHTML = `<div class="vacio">⚠️ ${esc(e.message || e)}</div>`; })
  .app_estadoCelular(LLAVE);
</script>
</body>
</html>
