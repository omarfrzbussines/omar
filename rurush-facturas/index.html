  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px -apple-system, system-ui, Roboto, sans-serif; padding-bottom:72px; }

  .estado button { flex:none; background:none; border:1px solid currentColor; color:inherit; border-radius:8px; padding:5px 9px; font-size:12px; }

<script>
/* RURUSH Facturas — control de los gastos del día a día (agua, limpieza, útiles,
   arreglo de máquinas…). Se toma la foto del comprobante, se llena lo importante
   y la app calcula el resto y lo sube sola a OneDrive:
     • la foto (comprimida) en  <carpeta>/AAAA-MM MES/
     • una fila en              <carpeta>/Control de gastos.xlsx  (tabla "Gastos")
   Si no hay internet, queda en cola en el celular y se sube apenas vuelva.
   Ajustes compartidos (personas, categorías, comprobantes) viven en <carpeta>/config.json. */

// ⬇️ PEGA AQUÍ el "Id. de aplicación (cliente)" de Azure (ver INSTALAR.md, paso 1).
const CLIENT_ID = 'PEGA-AQUI-EL-ID-DE-APLICACION';

const SCOPES = ['User.Read', 'Files.ReadWrite.All'];
const GRAPH = 'https://graph.microsoft.com/v1.0';
const EXCEL = 'Control de gastos.xlsx';
const TABLA = 'Gastos';
const HOJA = 'Registro';
const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SETIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const COLUMNAS = ['ID', 'Fecha', 'Mes', 'Semana', 'Registrado por', 'Categoría', 'Descripción', 'Cantidad', 'Precio unitario',
  'Proveedor', 'RUC', 'Comprobante', 'Nº comprobante', 'Base imponible', 'IGV', 'Total', 'Pagado con',
  'Fotos', 'Ver foto', 'Observación', 'Registrado el', 'Subido por'];
const CONFIG_BASE = {
  igv: 18,
  personas: ['DANNA', 'LAURA', 'MÓNICA', 'VALERIA', 'DILAN', 'OMAR'],
  categorias: ['Agua', 'Limpieza', 'Útiles y oficina', 'Mantenimiento de máquinas', 'Reparaciones del local', 'Servicios', 'Movilidad', 'Otros'],
  // igv: true = ese comprobante trae el IGV desglosado (sirve como crédito fiscal)
  comprobantes: [
    { nombre: 'Boleta', igv: false }, { nombre: 'Factura', igv: true },
    { nombre: 'Recibo / nota', igv: false }, { nombre: 'Sin comprobante', igv: false }
  ],
  metodos: ['Caja chica', 'Yape', 'Plin', 'Tarjeta', 'Transferencia']
};

/* ---------- utilidades ---------- */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const soles = (n) => 'S/ ' + r2(n).toFixed(2);
const num = (v) => { const n = parseFloat(String(v || '').replace(',', '.').replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; };
const isoLocal = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fm = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const limpio = (s) => String(s || '').replace(/[\\/:*?"<>|#%]/g, '').replace(/\s+/g, ' ').trim();
const ls = {
  get(k, d) { try { const v = localStorage.getItem('fac_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fac_' + k, JSON.stringify(v)); } catch (e) { /* lleno o bloqueado */ } }
};
function toast(t, ms) {
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms || 2600);
}

// Semana del año (ISO): para sumar los gastos por semana en el Excel.
function semana(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  return Math.ceil(((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400e3 + 1) / 7);
}

// El link "?carpeta=..." que manda el admin queda guardado en este celular.
(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('carpeta')) {
    ls.set('carpeta', p.get('carpeta'));
    history.replaceState(null, '', location.pathname + location.hash);
  }
})();

/* ---------- login Microsoft ---------- */

let MS = null;
async function iniciarMsal() {
  MS = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/common', redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: 'localStorage' }
  });
  if (MS.initialize) await MS.initialize();
  const r = await MS.handleRedirectPromise();
  if (r && r.account) MS.setActiveAccount(r.account);
  if (!MS.getActiveAccount() && MS.getAllAccounts()[0]) MS.setActiveAccount(MS.getAllAccounts()[0]);
  return MS.getActiveAccount();
}
const cuenta = () => MS && MS.getActiveAccount();
async function token() {
  const account = cuenta();
  if (!account) throw new Error('Inicia sesión con Microsoft.');
  try {
    return (await MS.acquireTokenSilent({ scopes: SCOPES, account })).accessToken;
  } catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError) {
      await MS.acquireTokenRedirect({ scopes: SCOPES, account });
      return new Promise(() => {});   // la página se va al login de Microsoft
    }
    throw e;
  }
}

/* ---------- Microsoft Graph (OneDrive) ---------- */

async function g(method, ruta, body, extra) {
  const h = Object.assign({ Authorization: 'Bearer ' + await token() }, extra || {});
  let cuerpo = body;
  if (body != null && !(body instanceof Blob) && typeof body !== 'string' && !(body instanceof ArrayBuffer)) {
    h['Content-Type'] = 'application/json'; cuerpo = JSON.stringify(body);
  }
  return fetch(ruta.startsWith('http') ? ruta : GRAPH + ruta, { method, headers: h, body: cuerpo == null ? undefined : cuerpo });
}
async function gj(method, ruta, body, extra) {
  const r = await g(method, ruta, body, extra);
  if (r.ok) return r.status === 204 ? null : r.json();
  let msj = 'OneDrive respondió ' + r.status;
  try { const j = await r.json(); if (j.error && j.error.message) msj += ': ' + j.error.message; } catch (e) { /* sin cuerpo */ }
  const err = new Error(msj); err.status = r.status; throw err;
}
const ruta = (...partes) => partes.join('/').split('/').filter(Boolean).map(encodeURIComponent).join('/');
const shareId = (url) => 'u!' + btoa(unescape(encodeURIComponent(url))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
const espera = (ms) => new Promise((res) => setTimeout(res, ms));

// Carpeta hija por nombre; la crea si no existe.
async function carpeta(driveId, padreId, nombre) {
  const r = await g('GET', `/drives/${driveId}/items/${padreId}:/${ruta(nombre)}`);
  if (r.ok) return (await r.json()).id;
  if (r.status !== 404) throw new Error('OneDrive respondió ' + r.status + ' al buscar la carpeta ' + nombre);
  try {
    return (await gj('POST', `/drives/${driveId}/items/${padreId}/children`, { name: nombre, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' })).id;
  } catch (e) {
    if (e.status === 409) return (await gj('GET', `/drives/${driveId}/items/${padreId}:/${ruta(nombre)}`)).id;   // la creó otro celular a la vez
    throw e;
  }
}

// Carpeta raíz: un link compartido (https://1drv.ms/... o https://...sharepoint.com/...) o un nombre en mi OneDrive.
const carpetaConf = () => ls.get('carpeta', 'RURUSH Facturas');
async function raiz() {
  const conf = carpetaConf();
  const c = ls.get('raiz');
  if (c && c.conf === conf) return c;
  let item;
  if (/^https?:\/\//i.test(conf)) {
    item = await gj('GET', `/shares/${shareId(conf)}/driveItem`);
    if (!item.folder) throw new Error('El link de la carpeta no es de una carpeta.');
  } else {
    const drive = await gj('GET', '/me/drive');
    const root = await gj('GET', '/me/drive/root');
    let id = root.id;
    for (const parte of conf.split('/').map((s) => s.trim()).filter(Boolean)) id = await carpeta(drive.id, id, parte);
    item = await gj('GET', `/drives/${drive.id}/items/${id}`);
    item.parentReference = Object.assign({}, item.parentReference, { driveId: drive.id });
  }
  const res = { conf, driveId: item.parentReference.driveId, id: item.id, nombre: item.name, web: item.webUrl };
  ls.set('raiz', res);
  return res;
}

/* ---------- config compartida (config.json en la carpeta) ---------- */

let CFG = ls.get('config', CONFIG_BASE);
async function cargarConfig() {
  const R = await raiz();
  const r = await g('GET', `/drives/${R.driveId}/items/${R.id}:/config.json:/content`);
  if (r.ok) {
    CFG = Object.assign({}, CONFIG_BASE, await r.json());
  } else if (r.status === 404) {
    CFG = Object.assign({}, CONFIG_BASE);
    await guardarConfig(CFG);
  } else throw new Error('OneDrive respondió ' + r.status + ' al leer config.json');
  ls.set('config', CFG);
}
async function guardarConfig(c) {
  const R = await raiz();
  await gj('PUT', `/drives/${R.driveId}/items/${R.id}:/config.json:/content`, JSON.stringify(c, null, 2), { 'Content-Type': 'application/json' });
  CFG = c; ls.set('config', c);
}

/* ---------- Excel ---------- */

function colLetra(n) { let s = ''; for (n++; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; }

async function excel() {
  const R = await raiz();
  const c = ls.get('excel');
  if (c && c.raiz === R.id) return c.id;
  const r = await g('GET', `/drives/${R.driveId}/items/${R.id}:/${ruta(EXCEL)}`);
  let id;
  if (r.ok) id = (await r.json()).id;
  else if (r.status === 404) id = await crearExcel(R);
  else throw new Error('OneDrive respondió ' + r.status + ' al buscar el Excel');
  ls.set('excel', { raiz: R.id, id });
  return id;
}
async function crearExcel(R) {
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([COLUMNAS]);
  ws['!cols'] = COLUMNAS.map((h) => ({ wch: Math.max(12, h.length + 2) }));
  XLSX.utils.book_append_sheet(wb, ws, HOJA);
  const datos = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  let item;
  try {
    item = await gj('PUT', `/drives/${R.driveId}/items/${R.id}:/${ruta(EXCEL)}:/content?@microsoft.graph.conflictBehavior=fail`,
      new Blob([datos], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  } catch (e) {
    if (e.status === 409) return (await gj('GET', `/drives/${R.driveId}/items/${R.id}:/${ruta(EXCEL)}`)).id;
    throw e;
  }
  // Convierte el encabezado en la tabla "Gastos" (Excel online tarda unos segundos en abrir un archivo recién subido).
  const base = `/drives/${R.driveId}/items/${item.id}/workbook`;
  for (let i = 0; ; i++) {
    try {
      const t = await gj('POST', base + '/tables/add', { address: `${HOJA}!A1:${colLetra(COLUMNAS.length - 1)}1`, hasHeaders: true });
      await gj('PATCH', base + '/tables/' + encodeURIComponent(t.id), { name: TABLA });
      break;
    } catch (e) {
      if (i >= 4) throw e;
      await espera(2000 * (i + 1));
    }
  }
  return item.id;
}
async function agregarFila(valores) {
  const R = await raiz();
  const id = await excel();
  try {
    await gj('POST', `/drives/${R.driveId}/items/${id}/workbook/tables/${TABLA}/rows`, { values: [valores] });
  } catch (e) {
    if (e.status === 404) { ls.set('excel', null); throw new Error('No encuentro la tabla "' + TABLA + '" en ' + EXCEL + ' (¿la borraron o renombraron?).'); }
    if (e.status === 409 || e.status === 423) throw new Error('El Excel está bloqueado (alguien lo tiene abierto en la app de escritorio). Se reintenta solo.');
    throw e;
  }
}

/* ---------- cola en el celular (IndexedDB): nada se pierde sin internet ---------- */

const DB = new Promise((res, rej) => {
  const q = indexedDB.open('rurush-facturas', 1);
  q.onupgradeneeded = () => q.result.createObjectStore('cola', { keyPath: 'id' });
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});
async function idb(modo, fn) {
  const db = await DB;
  return new Promise((res, rej) => {
    const tx = db.transaction('cola', modo), st = tx.objectStore('cola');
    const q = fn(st);
    tx.oncomplete = () => res(q && q.result);
    tx.onerror = () => rej(tx.error);
  });
}
const colaTodo = () => idb('readonly', (s) => s.getAll());
const colaPut = (x) => idb('readwrite', (s) => s.put(x));
const colaDel = (id) => idb('readwrite', (s) => s.delete(id));

let subiendo = false, ultimoError = '';
async function procesarCola() {
  if (subiendo || !cuenta()) return;
  subiendo = true; pintarEstado();
  try {
    const items = (await colaTodo()).sort((a, b) => a.creado - b.creado);
    ultimoError = '';
    for (const it of items) {
      try {
        await subir(it);
        await colaDel(it.id);
        historial(it.id, { estado: 'ok', foto: it.subidas[0] && it.subidas[0].web });
      } catch (e) {
        ultimoError = e.message || String(e);
        it.error = ultimoError; await colaPut(it);
        historial(it.id, { estado: 'err', error: ultimoError });
        if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(ultimoError)) break;
      }
    }
  } finally {
    subiendo = false; pintarEstado();
    if (tab === 'hist') pintar();
  }
}

// Paso a paso y guardando el avance: si se corta a la mitad, no duplica fotos ni filas.
async function subir(it) {
  const R = await raiz();
  const v = it.gasto;
  const mesId = await carpeta(R.driveId, R.id, v.fecha.slice(0, 7) + ' ' + MESES[Number(v.fecha.slice(5, 7)) - 1]);
  it.subidas = it.subidas || [];
  for (let i = it.subidas.length; i < it.fotos.length; i++) {
    const nombre = it.archivo + (it.fotos.length > 1 ? ' (' + (i + 1) + ')' : '') + '.jpg';
    const f = await gj('PUT', `/drives/${R.driveId}/items/${mesId}:/${ruta(nombre)}:/content?@microsoft.graph.conflictBehavior=rename`,
      it.fotos[i], { 'Content-Type': 'image/jpeg' });
    it.subidas.push({ nombre: f.name, web: f.webUrl });
    await colaPut(it);
  }
  if (!it.filaOk) {
    const foto = it.subidas[0] ? `=HYPERLINK("${it.subidas[0].web.replace(/"/g, '')}","Ver")` : '';
    const texto = (x) => /^\d+$/.test(x) ? "'" + x : x;   // RUC / nº: que Excel no los vuelva número
    await agregarFila([v.id, v.fecha, v.mes, v.semana, v.persona, v.categoria, v.descripcion, v.cantidad, v.unitario,
      v.proveedor, texto(v.ruc), v.comprobante, texto(v.numero), v.base, v.igv, v.total, v.metodo,
      it.fotos.length, foto, v.obs, v.registrado, (cuenta() && cuenta().username) || '']);
    it.filaOk = true;
    await colaPut(it);
  }
}

/* ---------- historial de este celular ---------- */

function historial(id, cambios) {
  const h = ls.get('hist', []);
  const i = h.findIndex((x) => x.id === id);
  if (i >= 0) Object.assign(h[i], cambios); else h.unshift(Object.assign({ id }, cambios));
  ls.set('hist', h.slice(0, 60));
}

/* ---------- fotos: comprimir antes de subir (≈300 KB en vez de 4 MB) ---------- */

function comprimir(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? res(b) : rej(new Error('No pude procesar la foto.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No pude abrir la foto.')); };
    img.src = url;
  });
}

}
const persona = () => ls.get('persona', '');
const proveedores = () => ls.get('proveedores', {});   // PROVEEDOR → RUC, se aprende de cada gasto
const compActual = () => CFG.comprobantes.find((c) => c.nombre === F.comprobante);

function calcular() {
  const total = r2(num(F.total)), cant = num(F.cantidad) || 1;
  const comp = compActual();
  const tasa = comp && comp.igv ? Number(CFG.igv) || 0 : 0;
  const base = r2(tasa ? total / (1 + tasa / 100) : total);
  const ahora = new Date();
  const fecha = F.fecha || isoLocal(ahora);
  return {
    total, cantidad: cant, unitario: r2(total / cant), tasa, base, igv: r2(total - base),
    fecha, mes: MESES[Number(fecha.slice(5, 7)) - 1], semana: semana(fecha),
    hoy: isoLocal(ahora), hora: pad(ahora.getHours()) + ':' + pad(ahora.getMinutes())
  };
}
function faltan() {
  const f = [];
  if (!persona()) f.push('quién registra');
  if (!F.fotos.length) f.push('foto');
  if (!F.categoria) f.push('categoría');
  if (!F.descripcion.trim()) f.push('qué se compró');
  if (!num(F.total)) f.push('total');
  if (!F.metodo) f.push('pagado con');
  return f;
}
function nombreArchivo(c) {
  return limpio([c.fecha, F.categoria.toUpperCase(), F.proveedor || F.descripcion, 'S' + c.total, persona()].join(' - ')).slice(0, 150);
}

function pintarCalc(c) {
  const comp = compActual();
  const avisos = [];

  if (c.fecha > c.hoy) avisos.push('La fecha del comprobante es futura');
  return `<h3>🧮 SE CALCULA SOLO</h3>
    <div class="r"><span>Fecha</span><b>${fm(c.fecha)}</b></div>
    <div class="r"><span>Mes / semana</span><b>${c.mes} · sem ${c.semana}</b></div>
    ${c.cantidad > 1 ? `<div class="r"><span>Precio unitario</span><b>${soles(c.unitario)} × ${c.cantidad}</b></div>` : ''}
    ${c.tasa ? `<div class="r"><span>Base imponible</span><b>${soles(c.base)}</b></div>
    <div class="r"><span>IGV ${c.tasa}%</span><b>${soles(c.igv)}</b></div>` : ''}
    <div class="r tot"><span>Total</span><b>${soles(c.total)}</b></div>

}
function refrescarCalc() {
  const el = $('#calc'); if (!el) return;
  el.innerHTML = pintarCalc(calcular());
  const f = faltan();
  $('#guardar').disabled = !!f.length;
  $('#falta').textContent = f.length ? 'Falta: ' + f.join(', ') : 'Se sube solo a OneDrive';
}

async function guardar() {
  const f = faltan();
  if (f.length) return toast('Falta: ' + f.join(', '));
  const c = calcular();
  const id = 'G' + c.hoy.replace(/-/g, '') + '-' + c.hora.replace(':', '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const gasto = {
    id, fecha: c.fecha, mes: c.mes, semana: c.semana, persona: persona(), categoria: F.categoria,
    descripcion: F.descripcion.trim(), cantidad: c.cantidad, unitario: c.unitario,
    proveedor: F.proveedor.trim().toUpperCase(), ruc: F.ruc.trim(), comprobante: F.comprobante, numero: F.numero.trim().toUpperCase(),
    base: c.base, igv: c.igv, total: c.total, metodo: F.metodo, obs: F.obs.trim(), registrado: c.hoy + ' ' + c.hora
  };
  await colaPut({ id, creado: Date.now(), gasto, archivo: nombreArchivo(c), fotos: F.fotos.map((x) => x.blob), subidas: [], filaOk: false });
  historial(id, { estado: 'pend', reg: c.hoy, fecha: c.fecha, descripcion: gasto.descripcion, categoria: gasto.categoria,
    metodo: gasto.metodo, total: gasto.total, persona: gasto.persona });
  if (gasto.proveedor) { const p = proveedores(); p[gasto.proveedor] = gasto.ruc || p[gasto.proveedor] || ''; ls.set('proveedores', p); }
  F.fotos.forEach((x) => URL.revokeObjectURL(x.url));
  F = nuevoForm();
  window.scrollTo(0, 0);
  pintar();
  toast('✅ Guardado. Subiendo a OneDrive…');
  procesarCola();
}

  const deHoy = h.filter((x) => x.reg === hoy);
  const suma = (l) => l.reduce((t, x) => t + (Number(x.total) || 0), 0);
  const fila = (x) => {
    const tag = x.estado === 'ok' ? '<span class="tag ok">subido</span>' : x.estado === 'err' ? '<span class="tag err">reintentando</span>' : '<span class="tag pend">en cola</span>';

async function guardarAjustes() {
  const lineas = (id) => $(id).value.split('\n').map((s) => s.trim()).filter(Boolean);
  const nueva = Object.assign({}, CFG, {
    categorias: lineas('#cCategorias'), personas: lineas('#cPersonas').map((s) => s.toUpperCase()), metodos: lineas('#cMetodos'),
    comprobantes: lineas('#cComprobantes').map((l) => {
      const [nombre, marca] = l.split('|').map((s) => s.trim());
      return { nombre, igv: /^igv$/i.test(marca || '') };
    }),
    igv: num($('#cIgv').value)
  });
  if (!nueva.categorias.length || !nueva.personas.length || !nueva.metodos.length || !nueva.comprobantes.length) return toast('No dejes listas vacías.');
  const carpetaNueva = $('#cCarpeta').value.trim() || 'RURUSH Facturas';
  const btn = $('#cGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (carpetaNueva !== carpetaConf()) {
      ls.set('carpeta', carpetaNueva); ls.set('raiz', null); ls.set('excel', null);
      await raiz();
      await cargarConfig();   // la carpeta nueva puede tener su propio config.json
      toast('📁 Carpeta cambiada. Revisa los ajustes y vuelve a guardar si quieres cambiarlos.', 4000);
    } else {
      await guardarConfig(nueva);
      toast('💾 Ajustes guardados para todas');
    }
    if (!compActual()) F.comprobante = (CFG.comprobantes[0] || {}).nombre || '';
    pintarSub(); pintar();
  } catch (e) {
    btn.disabled = false; btn.textContent = '💾 Guardar ajustes';
    toast('❌ ' + e.message, 5000);
  }
}

/* ---------- eventos ---------- */

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button, [data-tab]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; pintar(); window.scrollTo(0, 0); return; }
  if (t.id === 'login') return MS.loginRedirect({ scopes: SCOPES, prompt: 'select_account' });
  if (t.id === 'tomarFoto' || t.id === 'otraFoto') { $('#cam').value = ''; return $('#cam').click(); }
  if (t.dataset.quitar != null) { const [x] = F.fotos.splice(Number(t.dataset.quitar), 1); URL.revokeObjectURL(x.url); return pintar(); }
  if (t.dataset.per != null) { ls.set('persona', t.dataset.per); pintarSub(); return pintar(); }
  if (t.dataset.cat != null) { F.categoria = t.dataset.cat; return pintar(); }
  if (t.dataset.comp != null) { F.comprobante = t.dataset.comp; return pintar(); }
  if (t.dataset.metodo != null) { F.metodo = t.dataset.metodo; return pintar(); }
  if (t.id === 'guardar') { t.disabled = true; try { await guardar(); } catch (e) { t.disabled = false; toast('❌ ' + e.message, 5000); } return; }
  if (t.id === 'reintentar') return procesarCola();
  if (t.id === 'cGuardar') return guardarAjustes();
  if (t.id === 'cCopiar') {
    const link = location.origin + location.pathname + '?carpeta=' + encodeURIComponent($('#cCarpeta').value.trim() || carpetaConf());
    try { await navigator.clipboard.writeText(link); toast('🔗 Link copiado'); } catch (e) { prompt('Copia este link:', link); }
    return;
  }
  if (t.id === 'cSalir') { if (confirm('¿Cerrar sesión de Microsoft en este celular?')) MS.logoutRedirect({ account: cuenta() }); }
});

document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (!['descripcion', 'total', 'cantidad', 'proveedor', 'ruc', 'numero', 'fecha', 'obs'].includes(id)) return;
  F[id] = ev.target.value;
  // Proveedor conocido en este celular → su RUC se llena solo.
  const ruc = proveedores()[F.proveedor.trim().toUpperCase()];
  if (id === 'proveedor' && ruc && !F.ruc) { F.ruc = ruc; $('#ruc').value = ruc; }
  refrescarCalc();
});

$('#cam').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  try {
    const blob = await comprimir(file);
    F.fotos.push({ blob, url: URL.createObjectURL(blob) });
    pintar();
  } catch (e) { toast('❌ ' + e.message, 4000); }
});

window.addEventListener('online', procesarCola);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') procesarCola(); });

/* ---------- arranque ---------- */

(async () => {
  if (/PEGA-AQUI/.test(CLIENT_ID)) {
    $('#sub').textContent = 'Falta configurar';
    $('#main').innerHTML = `<div class="login"><div style="font-size:54px">🛠️</div><p>Falta pegar el <b>CLIENT_ID</b> de Azure en <code>index.html</code>.<br>Mira <b>INSTALAR.md</b>, paso 1.</p></div>`;
    return;
  }
  if (typeof msal === 'undefined') return pantallaLogin('No cargó el login de Microsoft. Revisa el internet y recarga.');
  let acc;
  try { acc = await iniciarMsal(); } catch (e) { return pantallaLogin(e.message); }
  if (!acc) return pantallaLogin();
  $('#nav').classList.remove('hide');
  pintarSub(); pintar();
  try {
    await raiz();
    await cargarConfig();
    if (!F.cliente && !F.fotos.length) F = Object.assign(nuevoForm(), { fotos: F.fotos });
    pintarSub(); pintar();
  } catch (e) {
    // Sin internet o sin permiso: se trabaja con la config guardada y todo queda en cola.
    toast('⚠️ ' + e.message, 5000);
  }
  procesarCola();
})();
