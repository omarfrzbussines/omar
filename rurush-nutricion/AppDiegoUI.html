<!DOCTYPE html>
<html lang="es-PE">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrición Rurush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<style>
/* Consulta clínica: barra lateral oscura con la marca; la agenda como tabla de turnos (hora · socio · historial · estado · acciones) */
:root{
  --bg:#F4F2F1; --surface:#FFFFFF; --sunk:#F8F6F5; --ink:#1A1112; --ink-2:#4A3F40; --muted:#7D7071; --line:#E6E0DF; --line-2:#EFEAE9;
  --brand:#C8161D; --brand-dark:#A01016; --brand-ink:#FFFFFF; --side:#120A0B; --side-2:#1E1415; --side-ink:#F3ECEC; --side-muted:#A0918F;
  --ok:#1B7A47; --ok-bg:#E7F4EC; --wait:#8C5A00; --wait-bg:#FBF1DC; --bad:#B42318; --bad-bg:#FDECEA; --gray:#6F6566; --gray-bg:#F0ECEB;
  --info:#2357A6; --info-bg:#E8F0FB;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(18,10,11,.06),0 1px 1px rgba(18,10,11,.04);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand img{width:32px;height:auto}
.brand b{display:block;font-weight:800;font-size:17px;letter-spacing:.08em;font-stretch:115%}
.brand i{display:block;font-style:normal;font-size:11px;letter-spacing:.18em;color:var(--side-muted);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:14px 12px}
.nav .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:10px 10px 6px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#CFC4C3;font-weight:500;width:100%}
.nav button:hover{background:var(--side-2);color:var(--side-ink)}
.nav button[aria-current="true"]{background:var(--side-2);color:#fff;font-weight:600}
.nav button[aria-current="true"] svg{color:var(--brand)}
.nav .n{margin-left:auto;font-size:11.5px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:#E5DCDB}
.nav .n.hot{background:var(--brand);color:#fff}
.side .foot{margin-top:auto;padding:16px 20px 20px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--side-muted)}
.side .foot .who{display:flex;align-items:center;gap:10px;color:var(--side-ink);font-weight:600;font-size:13px}
.side .foot .av{width:30px;height:30px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.side .foot a{color:#D9CFCE;text-decoration:none;display:flex;align-items:center;gap:8px}
.side .foot a:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 32px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.crumb{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.topbar h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 11px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--sunk)}
.content{padding:24px 32px 56px;display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)} .dot.live{background:var(--ok)} .dot.err{background:var(--bad)}
.demo{background:var(--wait-bg);color:var(--wait);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}

/* botones */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.btn:hover{border-color:#CFC6C5;background:var(--sunk)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.94)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:6px 8px}

/* KPIs */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.stat+.stat{border-left:1px solid var(--line-2)}
.stat span{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.stat span i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat.ok span i{background:var(--ok)} .stat.wait span i{background:#D99A1E} .stat.bad span i{background:var(--bad)}

/* tarjeta y tabla de turnos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:15px;font-weight:700}
.card-h small{color:var(--muted);font-size:12.5px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty svg{width:28px;height:28px;display:block;margin:0 auto 8px;color:#C3B8B7}

.trow{display:grid;grid-template-columns:84px minmax(200px,1.3fr) minmax(160px,1fr) 128px 230px;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)}
.thead{border-top:0;background:var(--sunk);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:9px}
.trow.now{background:linear-gradient(90deg,#FFF7E6,transparent 65%)}
.trow.dim .nm{color:var(--muted);text-decoration:line-through}
.t-h{font-weight:700;font-size:15px} .t-h small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--gray-bg);color:var(--gray);border:0}
.tag.new{background:var(--info-bg);color:var(--info)}
button.tag{cursor:pointer} button.tag:hover{filter:brightness(.96)}
.tag svg{width:12px;height:12px}
.hist{font-size:12.5px;color:var(--ink-2);min-width:0}
.hist .l{color:var(--muted);font-size:11.5px;display:block}
.hist q{quotes:none;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.miss,.pill.novino{background:var(--bad-bg);color:var(--bad)} .pill.cancel,.pill.dup{background:var(--gray-bg);color:var(--gray)}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(18,10,11,.14);display:flex;flex-direction:column;min-width:200px;z-index:6;padding:5px}
.menu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13.5px;display:flex;align-items:center;gap:9px;color:var(--ink-2)}
.menu button:hover{background:var(--sunk);color:var(--ink)}
.menu button.danger{color:var(--bad)}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));overflow-x:auto}
.week .col{border-left:1px solid var(--line-2);min-width:0} .week .col:first-child{border-left:0}
.week .dh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:13px;background:var(--sunk)}
.week .dh small{color:var(--muted);font-weight:500}
.week .dh.today{background:var(--ink);color:#fff} .week .dh.today small{color:#E5DCDB}
.week .dh.off{color:var(--muted);font-weight:500}
.week .it{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px;width:100%;border-left:3px solid transparent}
.week .it:hover{background:var(--sunk)} .week .it b{min-width:36px;font-weight:600}
.week .it.ok{border-left-color:var(--ok)} .week .it.wait{border-left-color:#D99A1E} .week .it.miss,.week .it.novino{border-left-color:var(--bad)} .week .it.cancel,.week .it.dup{opacity:.5;text-decoration:line-through}
.week .none{padding:14px 12px;color:var(--muted);font-size:12.5px}

/* tablas simples */
.tbl{overflow-x:auto} table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 18px;background:var(--sunk);white-space:nowrap}
td{padding:11px 18px;border-top:1px solid var(--line-2);vertical-align:middle}
td.r{text-align:right;white-space:nowrap}

/* socios */
.searchbar{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;color:var(--muted)}
.searchbar input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.person{padding:14px 18px;border-top:1px solid var(--line-2)} .person:first-of-type{border-top:0}
.person h3{margin:0 0 8px;font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl{border-left:2px solid var(--line);margin-left:5px}
.tl div{padding:2px 0 8px 14px;position:relative;font-size:13px}
.tl div::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid #C3B8B7}
.tl div.ok::before{background:var(--ok);border-color:var(--ok)} .tl div.novino::before,.tl div.miss::before{border-color:var(--bad)}
.tl small{color:var(--muted)}

/* formularios y diálogos */
input[type=text],input[type=tel],input[type=search],input[type=password],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:0;border-color:#BFB3B2;box-shadow:0 0 0 3px rgba(200,22,29,.12)}
textarea{min-height:90px;resize:vertical}
.veil{position:fixed;inset:0;background:rgba(18,10,11,.45);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:20;overflow:auto;backdrop-filter:blur(2px)}
.dlg{background:var(--surface);border-radius:14px;width:min(580px,100%);display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.dlg header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dlg header .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2);flex:none}
.dlg header .ico.ok{background:var(--ok-bg);color:var(--ok)} .dlg header .ico.bad{background:var(--bad-bg);color:var(--bad)} .dlg header .ico.brand{background:#FCE8E9;color:var(--brand)}
.dlg header h3{margin:0;font-size:17px;font-weight:700} .dlg header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dlg header .x{margin-left:auto}
.dlg .body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.dlg footer{padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 14px 14px}
.field{display:flex;flex-direction:column;gap:6px} .field>label,.field>.lbl{font-weight:600;font-size:13px;color:var(--ink-2)}
.help{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:17px;height:17px;accent-color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px;color:var(--ink-2)}
.opt:hover{border-color:#CFC6C5}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600}
.box{background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2)}
.box b{color:var(--ink)}
.results{display:flex;flex-direction:column;gap:6px}
.res{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;gap:10px}
.res:hover{background:var(--sunk)} .res[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast svg{color:#6FD39A}

/* acceso */
.pinwrap{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--side)}
.pincard{background:var(--surface);border-radius:16px;padding:32px 30px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.pincard img{width:52px} .pincard h1{margin:0;font-size:20px} .pincard p{margin:0;color:var(--muted);font-size:13px}
.pincard input{text-align:center;font-size:22px;letter-spacing:.35em}


/* avance del mes */
.dlt{font-size:12px;font-weight:600;color:var(--muted)} .dlt.up{color:var(--ok)} .dlt.down{color:var(--bad)}
.stat.bad .dlt.up{color:var(--bad)} .stat.bad .dlt.down{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.bars{display:flex;align-items:flex-end;gap:18px;padding:22px 22px 16px;min-height:230px;border-top:0}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wk .stack{width:100%;max-width:64px;display:flex;flex-direction:column-reverse;border-bottom:1px solid var(--line)}
.wk .stack i{display:block;width:100%} .wk .stack i+i{border-bottom:2px solid var(--surface)}
.wk b{font-size:13px} .wk span{font-size:11.5px;color:var(--muted);white-space:nowrap}
i.o{background:var(--ok)} i.n{background:#E0675F} i.p{background:#E9DFDE}
.wk .stack i.o{border-radius:0} .wk .stack>i:last-child{border-radius:4px 4px 0 0}
.legend{display:flex;gap:12px;align-items:center} .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:-6px}
.kv{display:flex;flex-direction:column}
.kv>div{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px} .kv>div:first-child{border-top:0}
.kv span{font-size:12.5px;color:var(--muted)} .kv b{font-size:22px}
.meter{height:6px;background:var(--gray-bg);border-radius:99px;overflow:hidden} .meter i{display:block;height:100%;background:var(--ink)}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.trow{grid-template-columns:70px minmax(0,1fr) 120px;}.trow .hist{display:none}.trow .acts{grid-column:2 / -1;justify-content:flex-start}.thead{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)} .side{position:static;height:auto}
  .brand{padding:14px 16px} .nav{flex-direction:row;flex-wrap:wrap;padding:8px 12px} .nav .sec,.side .foot{display:none} .nav button{width:auto}
  .topbar,.content{padding-inline:16px} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .stat:nth-child(3){border-left:0}
}
@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>
</head>
<body>
<div id="root"></div>
<script>

var DEMO = !(window.google && google.script && google.script.run);
var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var S = { pin:"", data:null, view:"hoy", day:"", q:"", busy:false, err:"", loadedAt:null };
try { S.pin = localStorage.getItem("dg_pin") || ""; S.view = localStorage.getItem("dg_view") || "hoy"; } catch(e){}

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function d(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(x){function z(n){return(n<10?"0":"")+n;}return x.getFullYear()+"-"+z(x.getMonth()+1)+"-"+z(x.getDate());}
function add(i,n){var x=d(i);x.setDate(x.getDate()+n);return iso(x);}
function dow(i){return d(i).getDay();}
function lab(i,corto){if(!i)return"—";var x=d(i);return (corto?"":DIAS[x.getDay()]+" ")+x.getDate()+" "+MES[x.getMonth()];}
function hTxt(h){if(!h)return"—";var p=h.split(":"),H=+p[0];return((H+11)%12+1)+":"+p[1]+(H>=12?" pm":" am");}
function mins(h){if(!h)return 9999;var p=h.split(":");return +p[0]*60+ +p[1];}
function today(){return S.data?S.data.hoy:iso(new Date());}
function key(r){return r.pid?"p"+r.pid:"n"+r.socio.toLowerCase();}
function tel(r){return r.tel||(r.pid&&S.data.tels[r.pid])||"";}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function st(r){
  var e=(r.estado||"").toUpperCase();
  if(/^DUPLICADO/.test(e)||/DUPLICADO/i.test(r.obs)&&!r.hecho)return"dup";
  if(/^CANCELADA/.test(e))return"cancel";
  if(r.hecho)return"ok";
  if(/^NO VINO/.test(e))return"novino";
  if(r.fecha<today())return"miss";
  return"wait";
}
var LBL={ok:"✓ Evaluado",wait:"Por atender",miss:"Sin marcar",novino:"No vino",cancel:"Cancelada",dup:"Duplicado"};
function vivo(r){var s=st(r);return s!=="dup"&&s!=="cancel";}
function dia(f){return S.data.filas.filter(function(r){return r.fecha===f;}).sort(function(a,b){return mins(a.hora)-mins(b.hora);});}
function previas(r){var k=key(r);return S.data.filas.filter(function(x){return key(x)===k&&x.hecho&&x.fecha<r.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});}
function proximasFechas(n){var o=[],f=add(today(),1);while(o.length<n){if(S.data.dias.indexOf(dow(f))>=0)o.push(f);f=add(f,1);}return o;}
function lunes(f){var x=d(f);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x);}

/* ---------- servidor ---------- */
function call(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(ok,ko){
    if(DEMO)return demo(fn,args).then(ok,ko);
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ko(e&&e.message?e:new Error(String(e)));});
    r[fn].apply(r,[S.pin].concat(args));
  });
}
function cargar(silencio){
  if(!silencio)setStatus("","Leyendo la hoja…");
  return call("dg_datos").then(function(x){
    S.data=x; S.loadedAt=new Date(); if(!S.day)S.day=x.hoy;
    try{localStorage.setItem("dg_pin",S.pin);}catch(e){}
    render(); setStatus("live","Actualizado "+S.loadedAt.toLocaleTimeString("es-PE",{hour:"numeric",minute:"2-digit"})+" · se actualiza solo cada 2 minutos");
  },function(e){
    if(/^PIN$/.test(e.message)){S.pin="";try{localStorage.removeItem("dg_pin");}catch(x){} S.err="PIN incorrecto."; pinScreen(); return;}
    if(!S.data){S.err=e.message;pinScreen();return;}
    setStatus("err","No se pudo actualizar: "+e.message);
  });
}

function acciones(r){
  var s=st(r),b=[],m=[];
  if(s==="wait"&&r.fecha===today()||s==="miss"){b.push(btn("asistio",r,"Asistió","ok","check"));b.push(btn("novino",r,"No vino","","x"));m=["reagendar","cancelar","duplicado"];}
  else if(s==="wait"){b.push(btn("reagendar",r,"Reagendar","","resched"));m=["cancelar","duplicado"];}
  else if(s==="ok"){if(!r.agendar)b.push(btn("proxima",r,"Agendar próxima","primary","cal"));m=["deshacer"];}
  else if(s==="novino"){b.push(btn("reagendar",r,"Reagendar","primary","resched"));m=["deshacer"];}
  else m=["deshacer"];
  var N={reagendar:[ic("resched"),"Reagendar"],cancelar:[ic("ban"),"Cancelar cita"],duplicado:[ic("copy"),"Marcar como duplicado"],deshacer:[ic("undo"),"Deshacer / corregir"]};
  var more=m.length?'<span class="more"><button class="btn sm icon" data-menu="'+esc(r.act)+'" aria-haspopup="true" aria-label="Más acciones">'+ic("more")+'</button><span class="menu" hidden id="m'+esc(r.act)+'">'+
    m.map(function(a){return '<button class="'+(a==="cancelar"?"danger":"")+'" data-a="'+a+'" data-act="'+esc(r.act)+'">'+N[a][0]+N[a][1]+'</button>';}).join("")+'</span></span>':"";
  return b.join("")+more;
}

function row(r,conFecha){

  return '<div class="trow '+(s==="dup"||s==="cancel"?"dim":"")+(now?" now":"")+'"><div class="t-h">'+(conFecha?esc(lab(r.fecha,1))+'<small>'+esc(hTxt(r.hora))+'</small>':esc(h[0])+'<small>'+esc(h[1]||"")+'</small>')+'</div>'+
    '<div><div class="nm">'+esc(r.socio)+'</div><div class="sub">'+tags+'</div></div><div class="hist">'+hist+'</div><div>'+pill(s)+'</div><div class="acts">'+acciones(r)+'</div></div>';

function porAgendar(){
  var lim=add(today(),-90),ult={};
  S.data.filas.forEach(function(r){if(!r.fecha||!vivo(r))return;var k=key(r);if(!ult[k]||r.fecha>=ult[k].fecha)ult[k]=r;});
  return Object.keys(ult).map(function(k){return ult[k];}).filter(function(r){return r.hecho&&!r.agendar&&r.fecha>=lim;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
}

    l.map(function(r){var dd=Math.round((d(today())-d(r.fecha))/864e5);return '<tr><td><div class="nm">'+esc(r.socio)+'</div>'+(tel(r)?'<div class="help">'+esc(tel(r))+'</div>':'')+'</td><td>'+esc(lab(r.fecha))+'</td><td><span class="pill '+(dd>30?"miss":"wait")+'">'+dd+' días</span></td><td class="hist">'+esc(r.obs||"—")+'</td><td class="r">'+btn("proxima",r,"Agendar","primary","cal")+'</td></tr>';}).join("")+
    '</tbody></table></div>':vacio("check","Todos los evaluados tienen su próxima cita."))+'</section>';

function pendientes(){return S.data.filas.filter(function(r){return st(r)==="miss"&&r.fecha>=add(today(),-60);}).sort(function(a,b){return a.fecha<b.fecha?1:-1;});}

/* ---------- avance del mes ---------- */
var MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function resumen(y,m){   // m: 0-11
  var ini=iso(new Date(y,m,1)),fin=iso(new Date(y,m+1,0)),hoy=today();
  var rs=S.data.filas.filter(function(r){return r.fecha>=ini&&r.fecha<=fin&&vivo(r);});
  var ok=rs.filter(function(r){return st(r)==="ok";}),nv=rs.filter(function(r){var s=st(r);return s==="novino"||s==="miss";});
  var nuevos=ok.filter(function(r){return previas(r).length===0;}).length;
  var conProx=ok.filter(function(r){return r.agendar;}).length, ib=ok.filter(function(r){return r.inbody;}).length;
  var cerradas=ok.length+nv.length;
  return {ini:ini,fin:fin,rs:rs,ok:ok.length,nv:nv.length,nuevos:nuevos,controles:ok.length-nuevos,futuras:rs.filter(function(r){return st(r)==="wait";}).length,
    asist:cerradas?Math.round(ok.length*100/cerradas):null,prox:ok.length?Math.round(conProx*100/ok.length):null,ib:ok.length?Math.round(ib*100/ok.length):null,okRows:ok,nvRows:nv};
}
function delta(a,b,suf){if(a==null||b==null)return '<small class="help">sin dato del mes anterior</small>';var x=a-b;return '<small class="dlt '+(x>0?"up":x<0?"down":"")+'">'+(x>0?"+":"")+x+(suf||"")+' vs mes anterior</small>';}
function vMes(){
  var x=d(S.day),y=x.getFullYear(),m=x.getMonth(),R=resumen(y,m),P=resumen(m?y:y-1,m?m-1:11);
  $("#eb").textContent="Reportes · Avance del mes";$("#tt").textContent=cap(MESL[m])+" "+y;
  // semanas del mes (lunes a domingo)
  var semanas=[],l=lunes(R.ini);
  while(l<=R.fin){var f=add(l,6),en=R.rs.filter(function(r){return r.fecha>=l&&r.fecha<=f;});
    semanas.push({l:l,f:f,ok:en.filter(function(r){return st(r)==="ok";}).length,nv:en.filter(function(r){var s=st(r);return s==="novino"||s==="miss";}).length,pend:en.filter(function(r){return st(r)==="wait";}).length});l=add(l,7);}
  var max=Math.max(1,Math.max.apply(null,semanas.map(function(s){return s.ok+s.nv+s.pend;})));
  var bars=semanas.map(function(s){var h=function(n){return Math.round(n*150/max);};
    return '<div class="wk"><div class="stack" title="'+s.ok+' evaluados · '+s.nv+' no vinieron · '+s.pend+' por venir">'+
      (s.pend?'<i class="p" style="height:'+h(s.pend)+'px"></i>':'')+(s.nv?'<i class="n" style="height:'+h(s.nv)+'px"></i>':'')+(s.ok?'<i class="o" style="height:'+h(s.ok)+'px"></i>':'')+
      '</div><b>'+(s.ok+s.nv+s.pend)+'</b><span>'+d(s.l).getDate()+'–'+d(s.f).getDate()+' '+MES[d(s.f).getMonth()]+'</span></div>';}).join("");
  var pct=function(v){return v==null?"—":v+"%";};
  var top=R.okRows.filter(function(r){return r.obs;}).slice(-6).reverse();
  return '<div class="stats"><div class="stat ok"><span><i></i>Evaluaciones hechas</span><b>'+R.ok+'</b>'+delta(R.ok,P.ok)+'</div>'+
    '<div class="stat"><span><i></i>Primera vez / controles</span><b>'+R.nuevos+' <small style="font-size:15px;color:var(--muted)">/ '+R.controles+'</small></b><small class="help">'+R.futuras+' citas aún por venir este mes</small></div>'+
    '<div class="stat wait"><span><i></i>Asistencia</span><b>'+pct(R.asist)+'</b>'+delta(R.asist,P.asist," pts")+'</div>'+
    '<div class="stat bad"><span><i></i>No vinieron / sin marcar</span><b>'+R.nv+'</b>'+delta(R.nv,P.nv)+'</div></div>'+
    '<div class="grid2"><section class="card"><div class="card-h"><h2>Citas por semana</h2><small class="legend"><i class="o"></i>Evaluados <i class="n"></i>No vinieron <i class="p"></i>Por venir</small></div><div class="bars">'+bars+'</div></section>'+
    '<section class="card"><div class="card-h"><h2>Calidad del seguimiento</h2></div><div class="kv">'+
      '<div><span>Evaluados con próxima cita</span><b>'+pct(R.prox)+'</b><div class="meter"><i style="width:'+(R.prox||0)+'%"></i></div><small class="help">Meta: 100%. Los que faltan están en "Por agendar".</small></div>'+
      '<div><span>Evaluados con InBody en Drive</span><b>'+pct(R.ib)+'</b><div class="meter"><i style="width:'+(R.ib||0)+'%"></i></div></div>'+
      '<div><span>Mes anterior · evaluaciones</span><b>'+P.ok+'</b></div></div></section></div>'+
    '<section class="card"><div class="card-h"><h2>Últimos resultados del mes</h2><small>'+R.ok+' evaluaciones</small></div>'+
    (top.length?'<div class="tbl"><table><thead><tr><th>Fecha</th><th>Socio</th><th>Tipo</th><th>Observación</th></tr></thead><tbody>'+top.map(function(r){var n=previas(r).length;return '<tr><td>'+esc(lab(r.fecha))+'</td><td><div class="nm">'+esc(r.socio)+'</div></td><td>'+(n?'<span class="tag">Control '+(n+1)+'</span>':'<span class="tag new">Primera vez</span>')+'</td><td class="hist">'+esc(r.obs)+'</td></tr>';}).join("")+'</tbody></table></div>':vacio("chart","Todavía no hay evaluaciones con observación este mes."))+'</section>';
}

/* ---------- diálogos ---------- */
function fila(act){return S.data.filas.filter(function(r){return String(r.act)===String(act);})[0];}
function dialog(o){
  var v=document.createElement("div");v.className="veil";
  v.innerHTML='<form class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><header>'+(o.icon?'<span class="ico '+(o.tone||"")+'">'+ic(o.icon)+'</span>':'')+'<div><h3 id="dlgt">'+o.title+'</h3>'+(o.sub?'<p>'+o.sub+'</p>':'')+'</div><button type="button" class="btn icon ghost x" id="dlgx" aria-label="Cerrar">'+ic("x")+'</button></header><div class="body">'+o.body+'<div class="err" hidden id="dlgerr"></div></div>'+
    '<footer><button type="button" class="btn" id="dlgno">Cancelar</button><button class="btn '+(o.cls||"primary")+'" id="dlgok">'+o.ok+'</button></footer></form>';
  document.body.appendChild(v);
  function close(){v.remove();document.removeEventListener("keydown",k);}
  function k(e){if(e.key==="Escape"&&!S.busy)close();}
  document.addEventListener("keydown",k);
  $("#dlgno",v).onclick=$("#dlgx",v).onclick=function(){if(!S.busy)close();};
  v.addEventListener("click",function(e){if(e.target===v&&!S.busy)close();});
  if(o.init)o.init(v);
  $("form",v).onsubmit=function(e){
    e.preventDefault(); if(S.busy)return;
    var er=$("#dlgerr",v); er.hidden=true;
    var payload; try{payload=o.collect(v);}catch(x){er.textContent=x.message;er.hidden=false;return;}
    S.busy=true; var ok=$("#dlgok",v),txt=ok.innerHTML; ok.disabled=true; ok.textContent="Guardando…";
    call(o.fn,payload).then(function(res){S.busy=false;close();toast(res.msg||"Guardado");cargar(true);},
      function(x){S.busy=false;ok.disabled=false;ok.innerHTML=txt;er.textContent=x.message;er.hidden=false;});
  };
  var first=$("textarea,input:not([type=checkbox]):not([type=hidden])",v); if(first)first.focus();
}
function citaPicker(id,opcional,excepto){
  return '<div class="field" id="'+id+'"><span class="lbl">'+(opcional?"Próxima cita":"Nueva fecha")+'</span><div class="opts" data-fechas>'+
    (opcional?'<button type="button" class="opt" data-f="" aria-pressed="true">Sin próxima por ahora</button>':'')+
    proximasFechas(6).map(function(f){return '<button type="button" class="opt" data-f="'+f+'" aria-pressed="false">'+esc(cap(lab(f)))+'</button>';}).join("")+
    '</div><span class="lbl" data-hl hidden>Hora</span><div class="opts" data-horas></div><span class="help" data-hhelp>'+(opcional?"Recomendado: control en 3 semanas.":"Solo martes y miércoles, desde mañana.")+'</span><input type="hidden" data-exc value="'+esc(excepto||"")+'"></div>';
}
function wirePicker(v,id){
  var box=$("#"+id,v),sel={f:"",h:""};
  box.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){
    box.querySelectorAll("[data-f]").forEach(function(x){x.setAttribute("aria-pressed","false");});b.setAttribute("aria-pressed","true");
    sel.f=b.dataset.f;sel.h="";var hb=$("[data-horas]",box),hl=$("[data-hl]",box),hh=$("[data-hhelp]",box);
    if(!sel.f){hb.innerHTML="";hl.hidden=true;return;}
    hl.hidden=false;hb.innerHTML='<span class="help">Buscando horas libres…</span>';
    call("dg_libres",sel.f,$("[data-exc]",box).value).then(function(x){
      if(x.motivo){hb.innerHTML='<span class="err">'+esc(x.motivo)+'</span>';return;}
      hb.innerHTML=S.data.horas.map(function(h){var ok=x.libres.indexOf(h)>=0;return '<button type="button" class="opt" data-h="'+h+'" aria-pressed="false" '+(ok?"":"disabled title=\"Ocupado\"")+'>'+hTxt(h)+'</button>';}).join("");
      hh.textContent=x.libres.length?x.libres.length+" horas libres ese día.":"Ese día ya está lleno: elige otra fecha.";
      hb.querySelectorAll("[data-h]").forEach(function(c){c.onclick=function(){hb.querySelectorAll("[data-h]").forEach(function(y){y.setAttribute("aria-pressed","false");});c.setAttribute("aria-pressed","true");sel.h=c.dataset.h;};});
    },function(e){hb.innerHTML='<span class="err">'+esc(e.message)+'</span>';});
  };});
  return sel;
}
function historialBox(r){
  var p=previas(r);if(!p.length)return '<div class="box">Primera evaluación de este socio.</div>';
  return '<div class="box"><b>Evaluaciones anteriores</b><br>'+p.slice(-3).reverse().map(function(x){return esc(lab(x.fecha))+' — '+esc(x.obs||"sin observación");}).join("<br>")+'</div>';
}
var ACC={
  asistio:function(r){var sel;dialog({icon:"check",tone:"ok",title:"Registrar evaluación",sub:esc(r.socio)+" · "+esc(cap(lab(r.fecha)))+", "+esc(hTxt(r.hora)),ok:ic("check")+"Guardar evaluación",cls:"ok",fn:"dg_asistio",
    body:historialBox(r)+'<div class="field"><label for="obs">Observación</label><textarea id="obs" required placeholder="Ej.: -1.8 kg de grasa, +0.6 kg de músculo. Ajustar cena."></textarea><span class="help">Se guarda en la hoja y como nota en Pipedrive.</span></div>'+
      '<label class="check"><input type="checkbox" id="ib"> InBody subido a Drive</label>'+citaPicker("px",true,r.act),
    init:function(v){sel=wirePicker(v,"px");},
    collect:function(v){var o=$("#obs",v).value.trim();if(o.length<3)throw new Error("Escribe la observación.");if(sel.f&&!sel.h)throw new Error("Elige la hora de la próxima cita o marca \"Sin próxima por ahora\".");
      return {act:r.act,obs:o,inbody:$("#ib",v).checked,prox:sel.f?{fecha:sel.f,hora:sel.h}:null};}});},
  novino:function(r){dialog({icon:"x",tone:"bad",title:"Marcar inasistencia",sub:esc(r.socio)+" · "+esc(cap(lab(r.fecha)))+", "+esc(hTxt(r.hora)),ok:"Marcar no vino",fn:"dg_noVino",
    body:'<div class="field"><label for="nt">Nota (opcional)</label><input type="text" id="nt" placeholder="Ej.: avisó que estaba enfermo"></div><div class="box">La cita queda abierta en Pipedrive para que el seguimiento de las 11:30 le escriba por WhatsApp y lo reagende.</div>',
    collect:function(v){return {act:r.act,nota:$("#nt",v).value.trim()};}});},
  reagendar:function(r){var sel;dialog({icon:"resched",title:"Reagendar cita",sub:esc(r.socio)+" · ahora: "+esc(lab(r.fecha))+", "+esc(hTxt(r.hora)),ok:"Mover cita",fn:"dg_reagendar",
    body:citaPicker("rp",false,r.act)+'<div class="field"><label for="mt">Motivo (opcional)</label><input type="text" id="mt" placeholder="Ej.: pidió la tarde"></div>',
    init:function(v){sel=wirePicker(v,"rp");},
    collect:function(v){if(!sel.f||!sel.h)throw new Error("Elige fecha y hora.");return {act:r.act,fecha:sel.f,hora:sel.h,motivo:$("#mt",v).value.trim()};}});},
  proxima:function(r){var sel;dialog({icon:"cal",tone:"brand",title:"Agendar próximo control",sub:esc(r.socio)+" · evaluado el "+esc(lab(r.fecha)),ok:"Agendar",fn:"dg_agendarProxima",
    body:citaPicker("pp",false,""),init:function(v){sel=wirePicker(v,"pp");},
    collect:function(){if(!sel.f||!sel.h)throw new Error("Elige fecha y hora.");return {act:r.act,fecha:sel.f,hora:sel.h};}});},
  cancelar:function(r){dialog({icon:"ban",tone:"bad",title:"Cancelar cita",sub:esc(r.socio)+" · "+esc(lab(r.fecha))+", "+esc(hTxt(r.hora)),ok:"Cancelar cita",cls:"primary",fn:"dg_cancelar",
    body:'<div class="field"><label for="mo">Motivo</label><input type="text" id="mo" required placeholder="Ej.: viajó, ya no quiere, se lesionó"></div><div class="box">La fila queda en la hoja como historial. Si solo quiere otro día, usa Reagendar.</div>',
    collect:function(v){var m=$("#mo",v).value.trim();if(m.length<3)throw new Error("Escribe el motivo.");return {act:r.act,tipo:"cancelada",motivo:m};}});},
  duplicado:function(r){dialog({icon:"copy",title:"Marcar como duplicado",sub:esc(r.socio)+" · "+esc(lab(r.fecha))+", "+esc(hTxt(r.hora)),ok:"Sí, es duplicado",fn:"dg_cancelar",
    body:'<div class="box">Úsalo cuando el mismo socio aparece dos veces para la misma cita. Esta fila se tacha y su actividad se cierra en Pipedrive. La otra no cambia.</div>',
    collect:function(){return {act:r.act,tipo:"duplicado"};}});},
  deshacer:function(r){dialog({icon:"undo",title:"Volver a pendiente",sub:esc(r.socio)+" · "+esc(lab(r.fecha)),ok:"Sí, deshacer",fn:"dg_deshacer",
    body:'<div class="box">'+(r.hecho?"Se quita la marca de evaluado y se borra la nota que se creó en Pipedrive.":"La cita vuelve a quedar pendiente.")+'</div>',
    collect:function(){return {act:r.act};}});}
};
function sinCita(){
  var elegido=null,sel,t;
  dialog({icon:"plus",tone:"brand",title:"Socio sin cita",sub:"Registra la evaluación de hoy de alguien que vino sin reservar.",ok:ic("check")+"Guardar evaluación",cls:"ok",fn:"dg_sinCita",
    body:'<div class="field"><label for="bq">Buscar socio</label><input type="search" id="bq" placeholder="Celular (recomendado) o nombre"><div class="results" id="bres"></div>'+
      '<span class="help">Si no aparece, completa nombre y celular abajo y se crea su ficha.</span></div>'+
      '<div class="field" id="nuevo"><label for="nn">Socio nuevo · nombre y apellido</label><input type="text" id="nn" placeholder="Ej.: María Torres"><label for="nc">Celular</label><input type="tel" id="nc" placeholder="9XXXXXXXX"></div>'+
      '<div class="field"><label for="so">Observación</label><textarea id="so" required></textarea></div><label class="check"><input type="checkbox" id="sib"> InBody subido a Drive</label>'+citaPicker("sp",true,""),
    init:function(v){sel=wirePicker(v,"sp");var bq=$("#bq",v),br=$("#bres",v);
      bq.oninput=function(){clearTimeout(t);elegido=null;$("#nuevo",v).hidden=false;var q=bq.value.trim();if(q.length<3){br.innerHTML="";return;}
        t=setTimeout(function(){br.innerHTML='<span class="help">Buscando…</span>';call("dg_buscar",q).then(function(l){
          br.innerHTML=l.length?l.map(function(p,i){return '<button type="button" class="res" data-i="'+i+'" aria-pressed="false"><b>'+esc(p.nombre)+'</b><span class="help">'+esc(p.tels.join(" · ")||"sin celular")+'</span></button>';}).join(""):'<span class="help">No encontré a nadie. Completa "Socio nuevo".</span>';
          br.querySelectorAll(".res").forEach(function(b){b.onclick=function(){br.querySelectorAll(".res").forEach(function(x){x.setAttribute("aria-pressed","false");});b.setAttribute("aria-pressed","true");elegido=l[+b.dataset.i];$("#nuevo",v).hidden=true;};});
        },function(e){br.innerHTML='<span class="err">'+esc(e.message)+'</span>';});},400);};},
    collect:function(v){var o=$("#so",v).value.trim();if(o.length<3)throw new Error("Escribe la observación.");if(sel.f&&!sel.h)throw new Error("Elige la hora de la próxima cita.");
      var q={obs:o,inbody:$("#sib",v).checked,prox:sel.f?{fecha:sel.f,hora:sel.h}:null};
      if(elegido){q.pid=elegido.pid;q.nombre=elegido.nombre;q.tel=elegido.tels[0]||"";}
      else{q.nombre=$("#nn",v).value.trim();q.tel=$("#nc",v).value.trim();if(q.nombre.split(/\s+/).length<2||/^(socio|cliente|nuevo|nueva|prueba)\b/i.test(q.nombre))throw new Error("Escribe el nombre y apellido reales del socio (no \"Socio\").");if(!/^9\d{8}$/.test(q.tel.replace(/\D/g,"").replace(/^51/,"")))throw new Error("Escribe un celular de 9 dígitos que empiece con 9.");}
      return q;}});
}
function toast(t){var x=document.createElement("div");x.className="toast";x.innerHTML=ic("check")+'<span></span>';x.querySelector("span").textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove();},3200);}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button,a");
  document.querySelectorAll(".menu").forEach(function(m){if(!t||t.dataset.menu!==m.id.slice(1))m.hidden=true;});
  if(!t)return;
  if(t.dataset.v){S.view=t.dataset.v;try{localStorage.setItem("dg_view",S.view);}catch(x){}render();return;}
  if(t.dataset.menu){var m=$("#m"+CSS.escape(t.dataset.menu));m.hidden=!m.hidden;return;}
  if(t.dataset.a){var r=fila(t.dataset.act);if(r)ACC[t.dataset.a](r);return;}
  if(t.dataset.day){S.day=t.dataset.day;S.view="hoy";render();return;}
  if(t.dataset.copy){var c=t.dataset.copy;try{navigator.clipboard.writeText(c).then(function(){toast("Celular copiado");},function(){toast(c);});}catch(x){toast(c);}return;}
  if(t.id==="sincita"){sinCita();return;}
  if(t.id==="prev"||t.id==="next"){var sg=t.id==="prev"?-1:1;if(S.view==="mes"){var x=d(S.day);x.setDate(1);x.setMonth(x.getMonth()+sg);S.day=iso(x);}else S.day=add(S.day,sg*(S.view==="semana"?7:1));render();return;}
  if(t.id==="hoyb"){S.day=today();render();return;}
  if(t.id==="refresh"){cargar();return;}
  if(t.id==="salir"){e.preventDefault();try{localStorage.removeItem("dg_pin");}catch(x){}location.reload();}
});
setInterval(function(){if(S.data&&!S.busy&&!document.querySelector(".veil")&&document.visibilityState==="visible")cargar(true);},120000);

/* ---------- modo demostración (solo si se abre el archivo fuera de Google) ---------- */
function demo(fn,a){
  return new Promise(function(ok,ko){setTimeout(function(){
    if(!demo.db){var h=iso(new Date()),n=["Ejemplo Ana Ruiz","Ejemplo Luis Paz","Ejemplo Carla Soto","Ejemplo Jorge Vega","Ejemplo Rosa Díaz","Ejemplo Pedro Gil"],F=[];
      var dd=add(h,-((new Date().getDay()+5)%7)); // último martes
      n.forEach(function(s,i){F.push({fila:10+i,fecha:dd,hora:["08:00","08:30","09:30","17:00","17:30","18:30"][i],socio:s,tel:"98765432"+i,estado:i<2?"HECHO ✓ + nota":"PENDIENTE",hecho:i<2,inbody:i===0,obs:i<2?"-1.2 kg de grasa":"",pfecha:"",phora:"",agendar:false,act:String(9000+i),pid:String(100+i)});});
      F.push({fila:30,fecha:add(dd,-21),hora:"08:00",socio:"Ejemplo Ana Ruiz",tel:"",estado:"HECHO",hecho:true,inbody:true,obs:"Inicio: 32% grasa",pfecha:dd,phora:"08:00",agendar:true,act:"8000",pid:"100"});
      F.push({fila:31,fecha:add(h,1),hora:"10:00",socio:"Ejemplo Mateo León",tel:"",estado:"PENDIENTE",hecho:false,inbody:false,obs:"",pfecha:"",phora:"",agendar:false,act:"9100",pid:"200"});
      demo.db={hoy:h,ahora:"09:10",horas:["08:00","08:30","09:00","09:30","10:00","10:30","17:00","17:30","18:00","18:30","19:00","19:30"],dias:[2,3],filas:F,tels:{},hojaUrl:"#"};}
    var db=demo.db,q=a[0]||{},r=db.filas.filter(function(x){return x.act===String(q.act);})[0];
    if(fn==="dg_datos")return ok(JSON.parse(JSON.stringify(db)));
    if(fn==="dg_libres")return ok({libres:["08:00","09:00","10:30","17:30","19:00"],motivo:""});
    if(fn==="dg_buscar")return ok([{pid:"100",nombre:"Ejemplo Ana Ruiz",tels:["987654320"]}]);
    if(fn==="dg_asistio"){r.hecho=true;r.obs=q.obs;r.inbody=q.inbody;r.estado="HECHO ✓ + nota";if(q.prox){r.agendar=true;r.pfecha=q.prox.fecha;r.phora=q.prox.hora;}return ok({msg:r.socio+" quedó evaluado (demo)"});}
    if(fn==="dg_noVino"){r.estado="NO VINO";return ok({msg:r.socio+" marcado como no vino (demo)"});}
    if(fn==="dg_reagendar"){r.fecha=q.fecha;r.hora=q.hora;r.estado="PENDIENTE";return ok({msg:"Reagendado (demo)"});}
    if(fn==="dg_cancelar"){r.estado=q.tipo==="duplicado"?"DUPLICADO":"CANCELADA";return ok({msg:"Listo (demo)"});}
    if(fn==="dg_deshacer"){r.hecho=false;r.estado="PENDIENTE";return ok({msg:"Vuelto a pendiente (demo)"});}
    if(fn==="dg_agendarProxima"){r.agendar=true;r.pfecha=q.fecha;r.phora=q.hora;return ok({msg:"Agendado (demo)"});}
    if(fn==="dg_sinCita"){db.filas.push({fila:99,fecha:db.hoy,hora:"09:00",socio:q.nombre,tel:q.tel,estado:"HECHO",hecho:true,inbody:q.inbody,obs:q.obs,act:String(Date.now()),pid:q.pid||"",agendar:!!q.prox});return ok({msg:"Registrado (demo)"});}
    ko(new Error("Acción desconocida"));
  },250);});
}

if(DEMO){S.pin="demo";cargar();} else if(S.pin){$("#root").innerHTML='<div class="pinwrap"><div class="pincard"><img src="'+LOGO+'" alt=""><p>Abriendo la agenda…</p></div></div>';cargar();} else pinScreen();
})();
