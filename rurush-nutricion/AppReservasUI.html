<!DOCTYPE html>
<html lang="es-PE">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservas Nutrición · Rurush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<style>
/* Mostrador de reservas: un solo flujo de arriba abajo — 1 celular → 2 ficha → 3 fecha y hora → confirmación */
:root{
  --bg:#F4F2F1; --surface:#FFFFFF; --sunk:#F8F6F5; --ink:#1A1112; --ink-2:#4A3F40; --muted:#7D7071; --line:#E6E0DF; --line-2:#EFEAE9;
  --brand:#C8161D; --brand-dark:#A01016; --side:#120A0B; --side-2:#1E1415; --side-muted:#A0918F;
  --ok:#1B7A47; --ok-bg:#E7F4EC; --wait:#8C5A00; --wait-bg:#FBF1DC; --bad:#B42318; --bad-bg:#FDECEA; --gray-bg:#F0ECEB;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:12px;
  --shadow:0 1px 2px rgba(18,10,11,.06),0 1px 1px rgba(18,10,11,.04);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--side);color:#fff}
.top .in{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:14px}
.top img{width:46px;height:auto}
.top b{display:block;font-weight:800;font-size:20px;letter-spacing:.08em;font-stretch:118%}
.top i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.2em;color:var(--side-muted);text-transform:uppercase}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#E5DCDB}
.top .who b{display:inline;font-size:13px;letter-spacing:0;font-stretch:100%}
.top .who button{all:unset;cursor:pointer;color:var(--side-muted);text-decoration:underline;font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.demo{background:var(--wait-bg);color:var(--wait);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.step{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.step h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.step h2 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12.5px;flex:none}
.step.off{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>input{flex:1;min-width:180px}
input[type=text],input[type=tel],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;width:100%;font-size:16px}
input:focus{outline:0;border-color:#BFB3B2;box-shadow:0 0 0 3px rgba(200,22,29,.12)}
input.big{font-size:22px;letter-spacing:.06em;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px} .field label{font-weight:600;font-size:13px;color:var(--ink-2)}
.help{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-size:16px;padding:13px 20px}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:6px 11px;font-size:13px}

.person{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.person.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#FFFBFB}
.person .hd{display:flex;align-items:flex-start;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.person h3{margin:0;font-size:17px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.meta span b{color:var(--ink)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;letter-spacing:.02em}
.tag.activo{background:var(--ok-bg);color:var(--ok)} .tag.inactivo{background:var(--gray-bg);color:#6F6566} .tag.sin{background:var(--wait-bg);color:var(--wait)}
.alert{border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:600}
.alert.warn{background:var(--wait-bg);color:var(--wait)} .alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert .row{margin-top:8px}
.list{display:flex;flex-direction:column;gap:6px}
.res{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.res:hover{background:var(--sunk)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.day{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;background:var(--surface)}
.day small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day b{display:block;font-size:22px;line-height:1.15}
.day span{font-size:12px;color:var(--muted)}
.day:hover{border-color:#CFC6C5}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff} .day[aria-pressed="true"] small,.day[aria-pressed="true"] span{color:#D9CFCE}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.hr{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;font-weight:700}
.hr:hover{border-color:#CFC6C5}
.hr[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.hr:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.hgrp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}

.done{padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.done .big{display:flex;gap:14px;align-items:center}
.done .chk{width:48px;height:48px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.done h2{margin:0;font-size:20px}
.wa{background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pinwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--side)}
.pincard{background:var(--surface);border-radius:16px;padding:30px 26px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.pincard img{width:72px;margin:0 auto}
.pincard h1{margin:0;font-size:20px} .pincard p{margin:0;color:var(--muted);font-size:13px}
.pincard input.pin{text-align:center;font-size:22px;letter-spacing:.35em}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600;text-align:left}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.top .who span{display:none}}
</style>
</head>

var DEMO = !(window.google && google.script && google.script.run);
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], DCORTO=["dom","lun","mar","mié","jue","vie","sáb"];
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DIR="Av. Larco 1164, Víctor Larco (al costado de Mass)";
var S={pin:"",asesora:"",ini:null,tel:"",fichas:null,sel:null,nuevo:null,parecidos:[],fecha:"",libres:null,hora:"",nota:"",mover:false,busy:"",err:"",done:null};
try{S.asesora=localStorage.getItem("rv_asesora")||"";}catch(e){}

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function d(i){var p=i.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function lab(i){if(!i)return"—";var x=d(i);return DIAS[x.getDay()]+" "+x.getDate()+" "+MES[x.getMonth()];}
function ddmm(i){return i?i.slice(8)+"/"+i.slice(5,7)+"/"+i.slice(0,4):"—";}
function hTxt(h){if(!h)return"—";var p=h.split(":"),H=+p[0];return((H+11)%12+1)+(p[1]==="00"?"":":"+p[1])+(H>=12?" pm":" am");}
function telOk(t){t=String(t||"").replace(/\D/g,"");if(t.indexOf("51")===0&&t.length===11)t=t.slice(2);return /^9\d{8}$/.test(t)?t:"";}
function ini(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0);}).join("").toUpperCase();}
function primer(n){var w=String(n||"").trim().split(/\s+/)[0]||"";return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}

function call(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(ok,ko){
    if(DEMO)return setTimeout(function(){try{ok(demo(fn,args));}catch(e){ko(e);}},350);
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ko(e&&e.message?e:new Error(String(e)));});
    r[fn].apply(r,[S.pin].concat(args));
  }).catch(function(e){
    if(/^PIN$/.test(e.message)){S.pin="";try{localStorage.removeItem("rv_pin");}catch(x){} S.err="PIN incorrecto.";pinScreen();throw new Error("PIN");}
    throw e;
  });
}
function toast(t){var x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove();},3000);}

/* ---------- acceso ---------- */
function pinScreen(){
  $("#root").innerHTML='<div class="pinwrap"><form class="pincard" id="f"><img src="'+LOGO+'" alt="Rurush"><h1>Reservas de nutrición</h1><p>Agenda la evaluación con Diego sin usar correo.</p>'+
    (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
    '<div class="field" style="text-align:left"><label for="as">Tu nombre (asesora)</label><input type="text" id="as" value="'+esc(S.asesora)+'" placeholder="Ej. Danna" autocomplete="name"></div>'+
    '<button class="btn primary">Empezar</button></form></div>';
  $("#as").focus();
  $("#f").onsubmit=function(e){e.preventDefault();var a=$("#as").value.trim();
    if(a.length<2){S.err="Escribe tu nombre.";return pinScreen();}
    S.asesora=a;S.err="";try{localStorage.setItem("rv_asesora",a);}catch(x){} arrancar();};
}
function arrancar(){
  $("#root").innerHTML='<div class="pinwrap"><div class="pincard"><img src="'+LOGO+'" alt="Rurush"><p>Cargando…</p></div></div>';
  call("rv_inicio").then(function(r){S.ini=r;render();setTimeout(function(){var t=$("#tel");if(t)t.focus();},50);},function(e){if(e.message!=="PIN"){S.err=e.message;pinScreen();}});
}

/* ---------- pantalla ---------- */
function persona(){return S.sel||S.nuevo;}
function render(){
  var h='<header class="top"><div class="in"><img src="'+LOGO+'" alt="Rurush"><div><b>RURUSH</b><i>Reservas · Nutrición</i></div>'+
    '<div class="who"><span>Asesora: <b>'+esc(S.asesora)+'</b></span><button id="salir">cambiar</button></div></div></header><main class="wrap">'+
    (DEMO?'<div class="demo">Modo demostración: datos de ejemplo, no se guarda nada.</div>':'');
  if(S.done) h+=vDone(); else h+=vPaso1()+vPaso2()+vPaso3();
  $("#root").innerHTML=h+'</main>';

}
function vPaso1(){
  return '<section class="card step"><h2><span class="n">1</span>Celular del socio</h2>'+
    '<form class="row" id="fb"><input class="big" type="tel" id="tel" inputmode="numeric" maxlength="12" placeholder="9XX XXX XXX" value="'+esc(S.tel)+'">'+
    '<button class="btn primary"'+(S.busy==="buscar"?' disabled':'')+'>'+(S.busy==="buscar"?'<span class="spin"></span> Buscando':'Buscar')+'</button></form>'+
    '<div class="help">Sin correo: la cita se guarda directo en la ficha del socio.</div>'+(S.err&&!S.fichas?'<div class="err">'+esc(S.err)+'</div>':'')+'</section>';
}
function fichaHtml(f,sel){
  var tag=f.estado==="activo"?'<span class="tag activo">ACTIVO</span>':f.estado==="inactivo"?'<span class="tag inactivo">INACTIVO</span>':'<span class="tag sin">SIN MEMBRESÍA REGISTRADA</span>';
  return '<div class="person'+(sel?' sel':'')+'"><div class="hd"><div class="av">'+esc(ini(f.nombre))+'</div><div style="flex:1;min-width:0"><h3>'+esc(f.nombre)+'</h3>'+
    '<div class="meta"><span>'+tag+'</span><span>DNI: <b>'+esc(f.dni||"—")+'</b></span><span>Cel: <b>'+esc((f.tels||[]).join(" · ")||"—")+'</b></span></div>'+
    '<div class="meta" style="margin-top:4px"><span>Evaluaciones: <b>'+(f.evaluaciones||0)+'</b></span><span>Última: <b>'+ddmm(f.ultima)+'</b></span>'+(f.org?'<span>'+esc(f.org)+'</span>':'')+'</div></div>'+

    (f.prox&&sel?'<div class="alert warn">Ya tiene cita el '+esc(lab(f.prox.fecha))+' a las '+esc(hTxt(f.prox.hora))+'. '+

    (f.prox&&!sel?'<div class="help">Ya tiene cita: '+esc(lab(f.prox.fecha))+' '+esc(hTxt(f.prox.hora))+'</div>':'')+'</div>';
}
function vPaso2(){

      '<div class="field"><label for="dni">DNI <span class="help">(opcional)</span></label><input type="text" id="dni" inputmode="numeric" maxlength="9" value="'+esc(n.dni||"")+'" placeholder="8 números"></div></div>'+
      (S.parecidos.length?'<div class="alert warn">¿Ya existe con otro celular? Si es alguno de estos, tócalo (se le agrega este celular):<div class="list" style="margin-top:8px">'+
        S.parecidos.map(function(p){return '<button type="button" class="res" data-ver="'+esc(p.pid)+'"><b>'+esc(p.nombre)+'</b><span class="help">'+esc(p.tels.join(" · ")||"sin celular")+'</span></button>';}).join("")+'</div></div>':'')+
      (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
      '<div class="row"><button class="btn"'+(S.busy==="nuevo"?' disabled':'')+'>'+(S.busy==="nuevo"?'<span class="spin"></span> Revisando':'Es nuevo, continuar')+'</button></div></form>';
  }
  return h+'</section>';
}
function vPaso3(){
  var p=persona();
  if(!p||(S.sel&&S.sel.prox&&!S.mover)) return '<section class="card step off"><h2><span class="n">3</span>Fecha y hora con Diego</h2></section>';
  var h='<section class="card step"><h2><span class="n">3</span>'+(S.mover?'Nueva fecha y hora':'Fecha y hora con Diego')+'</h2><div class="days">'+
    S.ini.fechas.map(function(f){var x=d(f);return '<button class="day" data-f="'+f+'" aria-pressed="'+(S.fecha===f)+'"><small>'+DCORTO[x.getDay()]+'</small><b>'+x.getDate()+'</b><span>'+MES[x.getMonth()]+'</span></button>';}).join("")+'</div>'+
    '<div class="help">Diego atiende martes y miércoles. Hoy no se agenda.</div>';
  if(S.fecha){
    if(S.libres===null)h+='<div class="help"><span class="spin"></span> Viendo horas libres…</div>';
    else{
      var L=S.libres,grp=function(t,hs){return '<div class="hgrp">'+t+'</div><div class="hours">'+hs.map(function(x){var ok=L.indexOf(x)>=0;return '<button class="hr" data-h="'+x+'" aria-pressed="'+(S.hora===x)+'"'+(ok?'':' disabled title="Ocupado"')+'>'+hTxt(x)+'</button>';}).join("")+'</div>';};
      h+=L.length?grp("Mañana",S.ini.horas.filter(function(x){return x<"12:00";}))+grp("Tarde",S.ini.horas.filter(function(x){return x>="12:00";})):'<div class="alert warn">Ese día ya no hay horas libres. Elige otro día.</div>';
    }
  }
  if(S.hora){
    h+='<div class="field"><label for="nota">Nota para Diego <span class="help">(opcional)</span></label><input type="text" id="nota" value="'+esc(S.nota)+'" placeholder="Ej. viene por bajar de peso, tiene InBody anterior"></div>'+
      '<div class="alert ok" style="font-weight:500">'+(S.mover?'Mover la cita de ':'Agendar a ')+'<b>'+esc(p.nombre)+'</b> el <b>'+esc(lab(S.fecha))+'</b> a las <b>'+esc(hTxt(S.hora))+'</b>'+(S.nuevo?' (ficha nueva)':'')+'.</div>'+
      (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
      '<button class="btn ok" id="ok"'+(S.busy==="ok"?' disabled':'')+'>'+(S.busy==="ok"?'<span class="spin"></span> Guardando…':(S.mover?'Confirmar cambio':'Confirmar reserva'))+'</button>';
  }
  return h+'</section>';
}
function waTxt(r){
  return "¡Hola "+primer(r.nombre)+"! 👋 Tu evaluación nutricional en Rurush quedó agendada:\n📅 "+lab(r.fecha).replace(/^./,function(c){return c.toUpperCase();})+"\n🕒 "+hTxt(r.hora)+"\n📍 "+DIR+
    "\n\nTe esperamos 5 minutos antes. Si no puedes venir, avísanos para cambiar la hora. 💪";
}
function vDone(){
  var r=S.done;
  return '<section class="card done"><div class="big"><div class="chk">✓</div><div><h2>'+(r.movida?'Cita cambiada':'Reserva confirmada')+'</h2><div class="help">'+esc(r.msg)+'</div></div></div>'+
    '<div class="field"><label>Mensaje para el socio (WhatsApp)</label><div class="wa" id="wa">'+esc(waTxt(r))+'</div></div>'+
    '<div class="row"><button class="btn primary" id="copiar">Copiar mensaje</button>'+(S.tel?'<a class="btn" target="_blank" href="https://wa.me/51'+esc(S.tel)+'?text='+encodeURIComponent(waTxt(r))+'">Abrir WhatsApp</a>':'')+
    '<button class="btn" id="nueva" style="margin-left:auto">Nueva reserva</button></div></section>';
}

/* ---------- acciones ---------- */
function reset(){S.tel="";S.fichas=null;S.sel=null;S.nuevo=null;S.parecidos=[];S.form=null;S.fecha="";S.libres=null;S.hora="";S.nota="";S.mover=false;S.err="";S.done=null;}
function bind(){
  var on=function(sel,ev,fn){var e=$(sel);if(e)e[ev]=fn;};
  on("#salir","onclick",function(){reset();pinScreen();});
  on("#fb","onsubmit",function(e){e.preventDefault();var t=telOk($("#tel").value);S.err="";
    if(!t){S.tel=$("#tel").value;S.fichas=null;S.err="Escribe el celular de 9 dígitos (empieza con 9).";return render();}
    reset();S.tel=t;S.busy="buscar";render();
    call("rv_buscarTel",t).then(function(r){S.busy="";S.fichas=r.fichas;if(r.fichas.length===1&&!r.fichas[0].mezclada)S.sel=r.fichas[0];render();},
      function(e){S.busy="";if(e.message!=="PIN"){S.err=e.message;render();}});});
  document.querySelectorAll("[data-sel]").forEach(function(b){b.onclick=function(){S.sel=S.fichas.filter(function(f){return f.pid===b.dataset.sel;})[0];S.err="";render();};});
  document.querySelectorAll("[data-ver]").forEach(function(b){b.onclick=function(){S.busy="nuevo";render();
    call("rv_ver",b.dataset.ver).then(function(f){S.busy="";S.sel=f;S.parecidos=[];render();},function(e){S.busy="";S.err=e.message;render();});};});
  on("#otra","onclick",function(){S.sel=null;S.nuevo=null;S.mover=false;S.fecha="";S.hora="";S.libres=null;S.err="";render();});
  on("#mover","onclick",function(){S.mover=true;render();});
  on("#nomover","onclick",function(){S.mover=false;S.fecha="";S.hora="";render();});
  on("#fn","onsubmit",function(e){e.preventDefault();
    var n=$("#nom").value.trim().replace(/\s+/g," "),dn=$("#dni").value.replace(/\D/g,"");S.form={nombre:n,dni:dn};S.err="";
    if(n.split(" ").filter(function(w){return w.length>=2;}).length<2||/^(socio|cliente|nuevo|nueva|prueba)\b/i.test(n)){S.err="Escribe nombre y apellido reales (no \"Socio\" ni \"Cliente\").";return render();}
    if(dn&&!/^\d{8,9}$/.test(dn)){S.err="El DNI debe tener 8 números. Si no lo tienes, déjalo vacío.";return render();}
    if(S.revisado===n+"|"+dn){S.nuevo={nombre:n,dni:dn};S.parecidos=[];return render();}   // ya vio los parecidos y confirmó que es nuevo
    S.busy="nuevo";render();
    call("rv_parecidos",n,dn).then(function(l){S.busy="";S.revisado=n+"|"+dn;S.parecidos=l;
      if(!l.length)S.nuevo={nombre:n,dni:dn};else S.err="Revisa la lista: si no es ninguno, vuelve a tocar \"Es nuevo, continuar\".";render();},
      function(e){S.busy="";S.err=e.message;render();});});
  document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){S.fecha=b.dataset.f;S.hora="";S.libres=null;S.err="";render();
    var f=S.fecha;call("rv_libres",f).then(function(l){if(S.fecha===f){S.libres=l;render();}},function(e){S.err=e.message;S.libres=[];render();});};});
  document.querySelectorAll("[data-h]").forEach(function(b){b.onclick=function(){S.hora=b.dataset.h;S.err="";render();var n=$("#nota");if(n)n.focus();};});
  on("#nota","oninput",function(e){S.nota=e.target.value;});
  on("#ok","onclick",function(){var p=persona();S.busy="ok";S.err="";render();
    var q={pid:S.sel?S.sel.pid:"",nombre:p.nombre,tel:S.tel,dni:S.nuevo?S.nuevo.dni:"",fecha:S.fecha,hora:S.hora,asesora:S.asesora,nota:S.nota};
    if(S.mover&&S.sel&&S.sel.prox)q.mover=S.sel.prox.act;
    call("rv_agendar",q).then(function(r){S.busy="";r.nombre=r.nombre||p.nombre;r.movida=!!q.mover;S.done=r;render();window.scrollTo(0,0);},
      function(e){S.busy="";if(e.message==="PIN")return;S.err=e.message;
        if(/ocupada/.test(e.message)){S.hora="";S.libres=null;var f=S.fecha;call("rv_libres",f).then(function(l){S.libres=l;render();});}
        render();});});
  on("#copiar","onclick",function(){var t=$("#wa").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Mensaje copiado");},function(){var r=document.createRange();r.selectNodeContents($("#wa"));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy");toast("Mensaje copiado");});});
  on("#nueva","onclick",function(){reset();render();$("#tel").focus();});
}

/* ---------- modo demostración (solo fuera de Google) ---------- */
function demo(fn,a){
  var hoy=new Date(),z=function(n){return(n<10?"0":"")+n;},iso=function(x){return x.getFullYear()+"-"+z(x.getMonth()+1)+"-"+z(x.getDate());};
  if(fn==="rv_inicio"){var f=[],x=new Date();for(var i=1;i<=28;i++){x=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()+i);if(x.getDay()===2||x.getDay()===3)f.push(iso(x));}
    return {hoy:iso(hoy),fechas:f,horas:["08:00","08:30","09:00","09:30","10:00","10:30","17:00","17:30","18:00","18:30","19:00","19:30"]};}
  if(fn==="rv_buscarTel"){var t=a[0];if(t==="999999999")return {tel:t,fichas:[]};
    if(t==="988888888")return {tel:t,fichas:[{pid:"2",nombre:"Ejemplo Luis Paz",dni:"70123456",org:"ALUMNOS ACTIVOS",estado:"activo",tels:[t],evaluaciones:2,ultima:"2026-09-15",prox:{act:"77",fecha:S.ini.fechas[1],hora:"18:00"}}]};
    return {tel:t,fichas:[{pid:"1",nombre:"Ejemplo Ana Ruiz Paz",dni:"72345678",org:"ALUMNOS ACTIVOS",estado:"activo",tels:[t],evaluaciones:1,ultima:"2026-08-20",prox:null}]};}
  if(fn==="rv_parecidos")return /ana/i.test(a[0])?[{pid:"1",nombre:"Ejemplo Ana Ruiz Paz",tels:["912345678"]}]:[];
  if(fn==="rv_ver")return {pid:a[0],nombre:"Ejemplo Ana Ruiz Paz",dni:"72345678",org:"ALUMNOS INACTIVOS",estado:"inactivo",tels:["912345678"],evaluaciones:3,ultima:"2026-05-02",prox:null};
  if(fn==="rv_libres")return ["08:00","09:00","09:30","10:30","17:00","18:30","19:00"];
  if(fn==="rv_agendar")return {ok:true,nombre:a[0].nombre,fecha:a[0].fecha,hora:a[0].hora,msg:a[0].nombre+" agendado el "+lab(a[0].fecha)+" a las "+hTxt(a[0].hora)+" (demo)"};
}

if(DEMO){S.asesora=S.asesora||"Demo";arrancar();} else if(S.asesora) arrancar(); else pinScreen();
})();
</script>
