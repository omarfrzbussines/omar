<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Llamadas">
<link rel="icon" href="https://em-content.zobj.net/source/apple/391/telephone-receiver_1f4de.png">
<link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/391/telephone-receiver_1f4de.png">
<title>RURUSH Llamadas</title>
<!-- Abre la app de Llamadas (Apps Script) a pantalla completa: se agrega a la pantalla de inicio
     con el link ?k=<llave de la asesora>. La llave no está en este archivo. -->
<style>
  html, body { margin:0; height:100%; background:#111; color:#ccc; font:16px -apple-system, system-ui, sans-serif; }
  body { padding-top: env(safe-area-inset-top); box-sizing:border-box; }
  iframe { display:block; width:100%; height:100%; border:0; }
  p { padding:24px; }
</style>
</head>
<body>
<script>
  const EXEC = 'https://script.google.com/macros/s/AKfycbzsvzWanclhKavutDs3l1N-7MEbdY4hojdnS3Pm8WkMffgSPihvwQxPuppMgCNwKG95/exec';
  const k = new URLSearchParams(location.search).get('k');
  if (!k) document.body.innerHTML = '<p>Falta tu llave en el link. Pídele a Omar tu link de Llamadas.</p>';
  else {
    const f = document.createElement('iframe');
    f.src = EXEC + '?k=' + encodeURIComponent(k);
    f.allow = 'microphone; clipboard-write';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
